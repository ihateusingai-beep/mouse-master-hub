<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>星空挑戰</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:"PingFang HK","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;color:#F5F0FF;
background:linear-gradient(180deg,#0B1026,#1a1440 40%,#2a1b5c);
-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation;overflow:hidden}
button{font:inherit;border:none;cursor:pointer}
.top{height:64px;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 12px;background:rgba(20,16,48,.92);border-bottom:3px solid rgba(182,140,255,.35)}
.who{display:flex;align-items:center;gap:8px;font-weight:900;font-size:1.1rem}
.who .av{width:42px;height:42px;border-radius:50%;border:3px solid #B388FF;background:#1E1838;display:grid;place-items:center;font-size:1.4rem}
.hint{flex:1;text-align:center;font-size:clamp(1.1rem,2.4vw,1.55rem);font-weight:900}
.hint b{background:#B388FF;color:#fff;padding:2px 8px;border-radius:8px}
.icon{width:48px;height:48px;border-radius:14px;background:#1E1838;border:3px solid rgba(255,255,255,.15);color:#fff;font-size:1.25rem;font-weight:900}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.stage{height:calc(100% - 64px);position:relative;overflow:hidden}
.meter-wrap{position:absolute;left:12px;right:12px;top:10px;z-index:5;display:flex;align-items:center;gap:10px}
.meter{flex:1;height:16px;border-radius:999px;background:rgba(255,255,255,.12);overflow:hidden}
.meter>i{display:block;height:100%;width:0;background:linear-gradient(90deg,#69F0AE,#B388FF);transition:width .2s}
.m-lab{font-weight:900;min-width:4.5rem;color:#E8E0FF}
.guide{position:absolute;left:12px;bottom:12px;z-index:5;background:rgba(30,24,60,.95);border:3px solid #B388FF;border-radius:16px;padding:8px 12px;font-weight:900;color:#fff;max-width:80%}
.toast{position:fixed;left:50%;top:16%;transform:translateX(-50%) scale(.92);background:#fff;border:4px solid #22c55e;color:#166534;font-size:1.4rem;font-weight:900;padding:12px 22px;border-radius:999px;opacity:0;pointer-events:none;transition:.2s;z-index:40}
.toast.show{opacity:1;transform:translateX(-50%) scale(1)}
.toast.bad{border-color:#FF6B9D;color:#9f1239}
.overlay{position:fixed;inset:0;background:rgba(10,8,30,.55);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.overlay.on{display:flex}
.modal{width:min(440px,94vw);background:#fff;color:#3D2B5A;border:5px solid #B388FF;border-radius:28px;padding:24px 18px;text-align:center}
.modal h2{font-size:2rem;margin-bottom:6px}
.modal p{font-weight:800;opacity:.8;margin-bottom:14px}
.btn{min-height:56px;min-width:140px;padding:12px 20px;border-radius:999px;background:linear-gradient(135deg,#B388FF,#FF6B9D);color:#fff;font-size:1.2rem;font-weight:900}
.btn.ghost{background:#fff;color:#3D2B5A;border:3px solid rgba(61,43,90,.12)}
.target{position:absolute;display:grid;place-items:center;border-radius:24px;border:5px solid #B388FF;background:#1E1838;box-shadow:0 10px 24px rgba(0,0,0,.35);font-size:2.8rem;cursor:pointer;z-index:3;touch-action:none;user-select:none}
.pulse{animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
.drop{position:absolute;width:160px;height:160px;right:10%;top:28%;border:5px dashed #69F0AE;border-radius:50%;background:rgba(105,240,174,.12);display:flex;align-items:center;justify-content:center;font-weight:900;color:#E8FFF3;z-index:2;transition:.15s}
.drop.hot{background:rgba(105,240,174,.28);box-shadow:0 0 0 6px rgba(105,240,174,.25)}
.star-bg{position:absolute;inset:0;pointer-events:none;background:
radial-gradient(1.5px 1.5px at 12% 22%,#fff,transparent),
radial-gradient(1px 1px at 70% 18%,#fff,transparent),
radial-gradient(1.5px 1.5px at 40% 70%,#fff,transparent),
radial-gradient(1px 1px at 85% 60%,#fff,transparent),
radial-gradient(1px 1px at 55% 40%,#fff,transparent)}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:45;overflow:hidden}
.confetti i{position:absolute;top:-16px;width:10px;height:16px;border-radius:3px;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
</style>
</head>
<body>
<div class="toast" id="toast"></div>
<div class="confetti" id="confetti"></div>
<div class="top">
  <div class="who"><div class="av" id="av">🐱</div><span id="whoName">同學</span></div>
  <div class="hint" id="hint">跟住提示做</div>
  <div class="row">
    <button class="icon" id="btnSpeak" type="button">🔊</button>
    <button class="icon" id="btnHub" type="button">🏠</button>
  </div>
</div>
<div class="stage" id="stage">
  <div class="meter-wrap"><div class="meter"><i id="fill"></i></div><div class="m-lab" id="mlab">0/6</div></div>
  <div class="guide" id="guide">左掣 · 拖 · 右掣</div>
</div>
<div class="overlay" id="win">
  <div class="modal">
    <div style="font-size:2.4rem">⭐⭐⭐</div>
    <h2>做得好！</h2>
    <p id="winMsg">完成喇</p>
        <div class="row" style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap">
      <button class="btn ghost" id="btnRetry" type="button">再玩</button>
      <button class="btn" id="btnCert" type="button">證書</button>
      <button class="btn" id="btnNext" type="button">下一個</button>
      <button class="btn ghost" id="btnHub2" type="button">主頁</button>
    </div>
  </div>
</div>
<script src="./reward.js"></script>
<script src="./cert.js"></script>
<script>
document.addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('selectstart',e=>e.preventDefault());
const NEED=5, HUB='./index.html';
const STEPS=['click','drag','right','click','drag','right'];
const $=id=>document.getElementById(id);
const stage=$('stage');
let progress=0, didWin=false, audioCtx=null;
function loadProfile(){
  let who=null,name='';
  try{
    const p=new URLSearchParams(location.search);
    name=(p.get('name')||localStorage.getItem('mouse_hub_name')||'').trim();
    who=JSON.parse(localStorage.getItem('mouse_hub_who')||'null');
  }catch(_){}
  if(!who) who={emoji:'🐱',name:'同學'};
  $('av').textContent=who.emoji||'🐱';
  $('whoName').textContent=name||who.name||'同學';
  return name||who.name||'同學';
}
const displayName=loadProfile();
function ctx(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();return audioCtx}
function tone(f,d=.12,t='sine',v=.2){try{const c=ctx(),o=c.createOscillator(),g=c.createGain();o.type=t;o.frequency.value=f;g.gain.setValueAtTime(v,c.currentTime);g.gain.exponentialRampToValueAtTime(.01,c.currentTime+d);o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+d)}catch(_){}}
function sfxOk(){tone(523,.1);setTimeout(()=>tone(659,.1),70);setTimeout(()=>tone(784,.12),140)}
function sfxWin(){[523,659,784,1046].forEach((f,i)=>setTimeout(()=>tone(f,.16,'triangle',.2),i*80))}
function sfxBad(){tone(180,.14,'square',.1)}
function speak(t){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='zh-HK';u.rate=.92;speechSynthesis.speak(u)}catch(_){}}
function toast(m,bad){const el=$('toast');el.textContent=m;el.classList.toggle('bad',!!bad);el.classList.add('show');clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove('show'),1100)}
function confetti(){const box=$('confetti');box.innerHTML='';const cols=['#B388FF','#FFD54F','#69F0AE','#4FC3F7'];for(let i=0;i<30;i++){const el=document.createElement('i');el.style.left=Math.random()*100+'vw';el.style.background=cols[i%cols.length];el.style.animationDuration=(1.1+Math.random()*1.2)+'s';box.appendChild(el)}setTimeout(()=>box.innerHTML='',2500)}
function setProgress(n){progress=n;$('fill').style.width=Math.min(100,n/NEED*100)+'%';const R=window.MouseHubReward;$('mlab').textContent=(R&&R.fishBones)?R.fishBones(n,NEED):(n+'/'+NEED);$('mlab').style.letterSpacing='2px';$('mlab').style.fontSize='1.2rem'}
function bigCelebrate(done){
  const ov=document.createElement('div');
  ov.style.cssText='position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;background:rgba(61,43,90,.55)';
  ov.innerHTML='<div style="font-size:clamp(2rem,8vw,3.5rem);font-weight:900;color:#fff;text-align:center;text-shadow:0 4px 16px rgba(0,0,0,.35)">🎉 太叻喇！<br><span style="font-size:1.15em">😻</span></div>';
  document.body.appendChild(ov);
  setTimeout(()=>{ov.remove();done&&done();},2000);
}
function win(){ didWin=true;
  try{ if(window.MouseHubReward) MouseHubReward.award('stars', progress, 'clear'); }catch(_e){}
  confetti(); sfxWin();
  if(window.MouseHubReward&&MouseHubReward.autoSpeak()) speak('做得好');
  const next=window.MouseHubReward?MouseHubReward.nextAfter('stars'):null;
  const nb=$('btnNext');
  if(nb){
    if(next && next.id!=='stars'){ nb.style.display=''; nb.textContent='下一個：'+next.title; nb.onclick=()=>{ location.href=MouseHubReward.gameUrl(next); }; }
    else { nb.style.display='none'; }
  }
  bigCelebrate(()=>{
    $('winMsg').textContent=displayName+' · 星空挑戰';
    $('win').classList.add('on');
  });
}
function clearTargets(){stage.querySelectorAll('.target,.drop,.star-bg').forEach(el=>el.remove())}
function hits(el,zone,pad=56){const a=el.getBoundingClientRect(),b=zone.getBoundingClientRect();const cx=(a.left+a.right)/2,cy=(a.top+a.bottom)/2;return cx>=b.left-pad&&cx<=b.right+pad&&cy>=b.top-pad&&cy<=b.bottom+pad}
function enableDrag(el,zone,onOk){
  let ox=0,oy=0,dragging=false;
  const detach=()=>{el.removeEventListener('pointermove',move);el.removeEventListener('pointerup',up);el.removeEventListener('pointercancel',up);window.removeEventListener('pointermove',move);window.removeEventListener('pointerup',up)};
  const down=e=>{if(e.button!=null&&e.button!==0)return;e.preventDefault();dragging=true;const r=el.getBoundingClientRect();ox=e.clientX-r.left;oy=e.clientY-r.top;el.style.position='fixed';el.style.left=r.left+'px';el.style.top=r.top+'px';el.style.zIndex='30';try{el.setPointerCapture(e.pointerId)}catch(_){}
    el.addEventListener('pointermove',move);el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up);window.addEventListener('pointermove',move);window.addEventListener('pointerup',up);move(e)};
  const move=e=>{if(!dragging||e.clientX==null)return;el.style.left=Math.max(0,Math.min(innerWidth-el.offsetWidth,e.clientX-ox))+'px';el.style.top=Math.max(0,Math.min(innerHeight-el.offsetHeight,e.clientY-oy))+'px';zone.classList.toggle('hot',hits(el,zone))};
  const up=()=>{if(!dragging)return;dragging=false;detach();if(hits(el,zone))onOk();else{sfxBad();toast('拖去圈',true);el.style.position='absolute';el.style.left='14%';el.style.top='34%';el.style.zIndex='';zone.classList.remove('hot')}};
  el.addEventListener('pointerdown',down);
}
function bindRight(el,onOk){
  let opened=false,until=0;
  const go=e=>{if(opened)return;opened=true;until=Date.now()+600;if(e){e.preventDefault();e.stopPropagation()}onOk()};
  el.addEventListener('pointerdown',e=>{if(e.button===2||e.ctrlKey)go(e)},true);
  el.addEventListener('mousedown',e=>{if(e.button===2||e.ctrlKey)go(e)},true);
  el.addEventListener('contextmenu',e=>go(e),true);
  el.addEventListener('auxclick',e=>{if(e.button===2)go(e)},true);
  el.addEventListener('click',e=>{if(opened||Date.now()<until){e.preventDefault();return}if(e.ctrlKey||e.metaKey){go(e);return}if(e.button===0){sfxBad();toast('兩指／右掣',true)}},true);
}
function advance(){setProgress(progress+1);if(progress>=NEED)setTimeout(win,300);else setTimeout(spawn,300)}
function spawn(){
  clearTargets();
  if(progress>=NEED) return;
  const bg=document.createElement('div');bg.className='star-bg';stage.appendChild(bg);
  const kind=STEPS[progress%STEPS.length];
  if(kind==='click'){
    $('hint').innerHTML='撳 <b>星星</b>';$('guide').textContent='左掣撳星星';speak('撳星星');
    const el=document.createElement('button');el.type='button';el.className='target pulse';el.textContent='⭐';
    el.style.width='110px';el.style.height='110px';el.style.left=(20+Math.random()*45)+'%';el.style.top=(25+Math.random()*35)+'%';
    el.onclick=()=>{el.remove();sfxOk();advance()};
    stage.appendChild(el);
  } else if(kind==='drag'){
    $('hint').innerHTML='拖 <b>月亮</b> 去圈';$('guide').textContent='拖月亮去綠色圈';speak('拖去圈');
    const zone=document.createElement('div');zone.className='drop';zone.textContent='放呢度';stage.appendChild(zone);
    const el=document.createElement('div');el.className='target pulse';el.textContent='🌙';el.style.width='100px';el.style.height='100px';el.style.left='14%';el.style.top='34%';stage.appendChild(el);
    enableDrag(el,zone,()=>{el.remove();sfxOk();advance()});
  } else {
    $('hint').innerHTML='右掣／兩指 開 <b>盒</b>';$('guide').textContent='兩指撳＝右掣';speak('右掣');
    const el=document.createElement('div');el.className='target pulse';el.textContent='📦';el.style.width='160px';el.style.height='140px';el.style.left='36%';el.style.top='30%';el.style.cursor='context-menu';stage.appendChild(el);
    bindRight(el,()=>{el.textContent='✨';setTimeout(()=>{el.remove();sfxOk();advance()},240)});
  }
}
function start(){ didWin=false; setProgress(0);spawn()}
$('btnHub').onclick=()=>{location.href='./index.html'};$('btnHub2').onclick=()=>{location.href=(didWin&&window.MouseHubReward)?MouseHubReward.hubWonUrl('stars'):'./index.html'+(didWin?('?won=stars'):'')};
$('btnSpeak').onclick=()=>speak('星空挑戰');
$('btnCert').onclick=()=>MouseHubCert.showCert('stars');
$('btnRetry').onclick=()=>{$('win').classList.remove('on');start()};
window.addEventListener('pointerdown',()=>{try{ctx()}catch(_){}},{once:true});
start();
</script>
</body>
</html>
