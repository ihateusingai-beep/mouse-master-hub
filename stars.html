<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>星空挑戰</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:"PingFang HK","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;color:#F5F0FF;
background:linear-gradient(180deg,#0B1026,#1a1440 40%,#2a1b5c);
-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation;overflow:hidden}
button{font:inherit;border:none;cursor:pointer}
.top{height:64px;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 12px;background:rgba(20,16,48,.92);border-bottom:3px solid rgba(182,140,255,.35)}
.who{display:flex;align-items:center;gap:8px;font-weight:900;font-size:1.1rem}
.who .av{width:42px;height:42px;border-radius:50%;border:3px solid #B388FF;background:#1E1838;display:grid;place-items:center;font-size:1.4rem}
.hint{flex:1;text-align:center;font-size:clamp(1.1rem,2.4vw,1.55rem);font-weight:900}
.hint b{background:#B388FF;color:#fff;padding:2px 8px;border-radius:8px}
.icon{width:48px;height:48px;border-radius:14px;background:#1E1838;border:3px solid rgba(255,255,255,.15);color:#fff;font-size:1.25rem;font-weight:900}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.stage{height:calc(100% - 64px);position:relative;overflow:hidden}
.meter-wrap{position:absolute;left:12px;right:12px;top:10px;z-index:5;display:flex;align-items:center;gap:10px}
.meter{flex:1;height:16px;border-radius:999px;background:rgba(255,255,255,.12);overflow:hidden}
.meter>i{display:block;height:100%;width:0;background:linear-gradient(90deg,#69F0AE,#B388FF);transition:width .2s}
.m-lab{font-weight:900;min-width:4.5rem;color:#E8E0FF}
.guide{position:absolute;left:12px;bottom:12px;z-index:5;background:rgba(30,24,60,.95);border:3px solid #B388FF;border-radius:16px;padding:8px 12px;font-weight:900;color:#fff;max-width:80%}
.toast{position:fixed;left:50%;top:16%;transform:translateX(-50%) scale(.92);background:#fff;border:4px solid #22c55e;color:#166534;font-size:1.4rem;font-weight:900;padding:12px 22px;border-radius:999px;opacity:0;pointer-events:none;transition:.2s;z-index:40}
.toast.show{opacity:1;transform:translateX(-50%) scale(1)}
.toast.bad{border-color:#FF6B9D;color:#9f1239}
.overlay{position:fixed;inset:0;background:rgba(10,8,30,.55);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.overlay.on{display:flex}
.modal{width:min(440px,94vw);background:#fff;color:#3D2B5A;border:5px solid #B388FF;border-radius:28px;padding:24px 18px;text-align:center}
.modal h2{font-size:2rem;margin-bottom:6px}
.modal p{font-weight:800;opacity:.8;margin-bottom:14px}
.btn{min-height:56px;min-width:140px;padding:12px 20px;border-radius:999px;background:linear-gradient(135deg,#B388FF,#FF6B9D);color:#fff;font-size:1.2rem;font-weight:900}
.btn.ghost{background:#fff;color:#3D2B5A;border:3px solid rgba(61,43,90,.12)}
.target{position:absolute;display:grid;place-items:center;border-radius:24px;border:5px solid #B388FF;background:#1E1838;box-shadow:0 10px 24px rgba(0,0,0,.35);font-size:2.8rem;cursor:pointer;z-index:3;touch-action:none;user-select:none}
.pulse{animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
.drop{position:absolute;width:160px;height:160px;right:10%;top:28%;border:5px dashed #69F0AE;border-radius:50%;background:rgba(105,240,174,.12);display:flex;align-items:center;justify-content:center;font-weight:900;color:#E8FFF3;z-index:2;transition:.15s}
.drop.hot{background:rgba(105,240,174,.28);box-shadow:0 0 0 6px rgba(105,240,174,.25)}
.star-bg{position:absolute;inset:0;pointer-events:none;background:
radial-gradient(1.5px 1.5px at 12% 22%,#fff,transparent),
radial-gradient(1px 1px at 70% 18%,#fff,transparent),
radial-gradient(1.5px 1.5px at 40% 70%,#fff,transparent),
radial-gradient(1px 1px at 85% 60%,#fff,transparent),
radial-gradient(1px 1px at 55% 40%,#fff,transparent)}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:45;overflow:hidden}
.confetti i{position:absolute;top:-16px;width:10px;height:16px;border-radius:3px;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
</style>
</head>
<body>
<div class="toast" id="toast"></div>
<div class="confetti" id="confetti"></div>
<div class="top">
  <div class="who"><div class="av" id="av">🐱</div><span id="whoName">同學</span></div>
  <div class="hint" id="hint">跟住提示做</div>
  <div class="row">
    <button class="icon" id="btnSpeak" type="button">🔊</button>
    <button class="icon" id="btnHub" type="button">🏠</button>
  </div>
</div>
<div class="stage" id="stage">
  <div class="meter-wrap"><div class="meter"><i id="fill"></i></div><div class="m-lab" id="mlab">0/6</div></div>
  <div class="guide" id="guide">左掣 · 拖 · 右掣</div>
</div>
<div class="overlay" id="win">
  <div class="modal">
    <div style="font-size:2.4rem">⭐⭐⭐</div>
    <h2>做得好！</h2>
    <p id="winMsg">完成喇</p>
        <div class="row" style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap">
      <button class="btn ghost" id="btnRetry" type="button">再玩</button>
      <button class="btn" id="btnCert" type="button">證書</button>
      <button class="btn" id="btnNext" type="button">下一個</button>
      <button class="btn ghost" id="btnHub2" type="button">主頁</button>
    </div>
  </div>
</div>
<script src="./reward.js"></script>
<script src="./cert.js"></script>
<script src="./common.js"></script>
<script>
const C = MouseHubCommon, NEED = 5, GID = 'stars';
const STEPS = ['click', 'drag', 'right', 'click', 'drag', 'right'];
const $ = C.$, stage = $('stage');
let progress = 0, didWin = false;
const displayName = C.loadProfile();
C.lockSEN(); C.armAudioOnce();
function setProgress(n) {
  progress = n; C.setProgress(n, NEED);
  const lab = $('mlab'); if (lab) { lab.style.letterSpacing = '2px'; lab.style.fontSize = '1.2rem'; }
}
function win() {
  C.finishClear({ gid: GID, progress, label: '星空挑戰', displayName, setDidWin: v => { didWin = v; } });
}
function clearTargets() { stage.querySelectorAll('.target,.drop,.star-bg').forEach(el => el.remove()); }
function advance() { setProgress(progress + 1); if (progress >= NEED) setTimeout(win, 300); else setTimeout(spawn, 300); }
function spawn() {
  clearTargets();
  if (progress >= NEED) return;
  const bg = document.createElement('div'); bg.className = 'star-bg'; stage.appendChild(bg);
  const kind = STEPS[progress % STEPS.length];
  if (kind === 'click') {
    $('hint').innerHTML = '撳 <b>星星</b>'; $('guide').textContent = '左掣撳星星'; C.speak('撳星星');
    const el = document.createElement('button'); el.type = 'button'; el.className = 'target pulse'; el.textContent = '⭐';
    el.style.width = '110px'; el.style.height = '110px';
    el.style.left = (20 + Math.random() * 45) + '%'; el.style.top = (25 + Math.random() * 35) + '%';
    el.onclick = () => { el.remove(); C.sfxOk(); advance(); };
    stage.appendChild(el);
  } else if (kind === 'drag') {
    $('hint').innerHTML = '拖 <b>月亮</b> 去圈'; $('guide').textContent = '拖月亮去綠色圈'; C.speak('拖去圈');
    const zone = document.createElement('div'); zone.className = 'drop'; zone.textContent = '放呢度'; stage.appendChild(zone);
    const el = document.createElement('div'); el.className = 'target pulse'; el.textContent = '🌙';
    el.style.width = '100px'; el.style.height = '100px'; el.style.left = '14%'; el.style.top = '34%'; stage.appendChild(el);
    C.enableDrag(el, zone, () => { el.remove(); C.sfxOk(); advance(); }, () => {
      C.toast('拖去圈', true);
      el.style.position = 'absolute'; el.style.left = '14%'; el.style.top = '34%'; el.style.zIndex = '';
    });
  } else {
    $('hint').innerHTML = '右掣／兩指 開 <b>盒</b>'; $('guide').textContent = '兩指撳＝右掣'; C.speak('右掣');
    const el = document.createElement('div'); el.className = 'target pulse'; el.textContent = '📦';
    el.style.width = '160px'; el.style.height = '140px'; el.style.left = '36%'; el.style.top = '30%';
    el.style.cursor = 'context-menu'; stage.appendChild(el);
    C.bindRight(el, () => { el.textContent = '✨'; setTimeout(() => { el.remove(); C.sfxOk(); advance(); }, 240); });
  }
}
function start() { didWin = false; setProgress(0); spawn(); }
C.wireChrome({ gid: GID, speakText: '星空挑戰', didWin: () => didWin, onRetry: start });
start();
</script>
</body>
</html>
