<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>打地鼠｜將軍澳培智學校</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:"PingFang HK","Noto Sans TC",system-ui,sans-serif;color:#3D2B5A;
background:linear-gradient(180deg,#E8F5E9,#C8E6C9 40%,#A5D6A7);
-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation;overflow:hidden}
button{font:inherit;border:none;cursor:pointer}
.top{height:60px;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 12px;background:rgba(255,255,255,.92);border-bottom:3px solid #66BB6A55}
.who{display:flex;align-items:center;gap:8px;font-weight:900}
.av{width:40px;height:40px;border-radius:50%;border:3px solid #43A047;display:grid;place-items:center;font-size:1.3rem;background:#fff}
.hint{flex:1;text-align:center;font-size:clamp(1.05rem,2.3vw,1.45rem);font-weight:900}
.hint b{background:#FFD54F;padding:2px 8px;border-radius:8px}
.icon{width:46px;height:46px;border-radius:14px;background:#fff;border:3px solid rgba(61,43,90,.12);font-size:1.15rem;font-weight:900}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.stage{height:calc(100% - 60px);position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;padding:16px}
.meter-wrap{position:absolute;left:12px;right:12px;top:10px;z-index:5;display:flex;align-items:center;gap:10px;pointer-events:none}
.meter{flex:1;height:16px;border-radius:999px;background:rgba(61,43,90,.12);overflow:hidden}
.meter>i{display:block;height:100%;width:0;background:linear-gradient(90deg,#69F0AE,#43A047);transition:width .2s}
.m-lab{font-weight:900;letter-spacing:1px;font-size:1.1rem}
.guide{position:absolute;left:12px;bottom:12px;z-index:5;background:rgba(255,255,255,.95);border:3px solid #43A047;border-radius:16px;padding:8px 12px;font-weight:900;max-width:85%}
.toast{position:fixed;left:50%;top:14%;transform:translateX(-50%) scale(.92);background:#fff;border:4px solid #22c55e;color:#166534;font-size:1.35rem;font-weight:900;padding:12px 20px;border-radius:999px;opacity:0;pointer-events:none;transition:.2s;z-index:40}
.toast.show{opacity:1;transform:translateX(-50%) scale(1)}.toast.bad{border-color:#FF6B9D;color:#9f1239}
.overlay{position:fixed;inset:0;background:rgba(61,43,90,.45);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.overlay.on{display:flex}
.modal{width:min(440px,94vw);background:#fff;border:5px solid #FFD54F;border-radius:28px;padding:22px 16px;text-align:center}
.modal h2{font-size:1.9rem;margin-bottom:6px}.modal p{font-weight:800;opacity:.8;margin-bottom:12px}
.btn{min-height:54px;min-width:120px;padding:12px 16px;border-radius:999px;background:linear-gradient(135deg,#43A047,#FFD54F);color:#fff;font-size:1.15rem;font-weight:900}
.btn.ghost{background:#fff;color:#3D2B5A;border:3px solid rgba(61,43,90,.12)}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:45;overflow:hidden}
.confetti i{position:absolute;top:-16px;width:10px;height:16px;border-radius:3px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(10px,2.5vw,18px);width:min(520px,92vw);margin-top:28px}
.hole{aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 50% 40%,#5D4037,#3E2723 70%);
border:5px solid #2E1A12;position:relative;overflow:hidden;box-shadow:inset 0 8px 16px rgba(0,0,0,.35)}
.mole{position:absolute;left:50%;bottom:-70%;transform:translateX(-50%);width:72%;font-size:clamp(2.4rem,10vw,3.6rem);
line-height:1;text-align:center;transition:bottom .18s ease;cursor:pointer;filter:drop-shadow(0 4px 6px rgba(0,0,0,.25));
background:transparent;border:none;padding:0}
.mole.up{bottom:8%}
.mole.hit{filter:brightness(1.3) drop-shadow(0 0 12px #FFD54F);transform:translateX(-50%) scale(1.15)}
</style>
</head>
<body>
<div class="toast" id="toast"></div>
<div class="confetti" id="confetti"></div>
<div class="top">
  <div class="who"><div class="av" id="av">🐱</div><span id="whoName">同學</span></div>
  <div class="hint" id="hint">地鼠出嚟 · 左掣 <b>打</b></div>
  <div class="row">
    <button class="icon" id="btnSpeak" type="button">🔊</button>
    <button class="icon" id="btnHub" type="button">🏠</button>
  </div>
</div>
<div class="stage" id="stage">
  <div class="meter-wrap"><div class="meter"><i id="fill"></i></div><div class="m-lab" id="mlab">0/5</div></div>
  <div class="guide" id="guide">等地鼠彈出，再左掣一點！</div>
  <div class="grid" id="grid"></div>
</div>
<div class="overlay" id="win">
  <div class="modal">
    <div style="font-size:2.4rem" id="winMedal">🥇</div>
    <h2>做得好！</h2>
    <p id="winMsg">完成</p>
    <div class="row">
      <button class="btn ghost" id="btnRetry" type="button">再玩</button>
      <button class="btn" id="btnCert" type="button">證書</button>
      <button class="btn" id="btnNext" type="button">下一個</button>
      <button class="btn ghost" id="btnHub2" type="button">主頁</button>
    </div>
  </div>
</div>
<script src="./reward.js"></script>
<script src="./cert.js"></script>
<script src="./common.js"></script>
<script>
const C = MouseHubCommon, NEED = 5, GID = 'moles';
const $ = C.$, grid = $('grid');
let progress = 0, didWin = false, timer = 0, active = -1, moles = [];
const displayName = C.loadProfile();
C.lockSEN(); C.armAudioOnce();

function build() {
  grid.innerHTML = '';
  moles = [];
  for (let i = 0; i < 9; i++) {
    const hole = document.createElement('div');
    hole.className = 'hole';
    const m = document.createElement('button');
    m.type = 'button'; m.className = 'mole'; m.textContent = '🐹';
    m.setAttribute('aria-label', '地鼠');
    m.addEventListener('click', e => { e.preventDefault(); hit(i); });
    m.addEventListener('pointerdown', e => { if (e.button === 0) { e.preventDefault(); hit(i); } });
    hole.appendChild(m);
    grid.appendChild(hole);
    moles.push(m);
  }
}
function hideAll() {
  active = -1;
  moles.forEach(m => { m.classList.remove('up', 'hit'); });
}
function pop() {
  if (didWin || progress >= NEED) return;
  hideAll();
  active = Math.floor(Math.random() * 9);
  moles[active].classList.add('up');
  clearTimeout(timer);
  timer = setTimeout(() => {
    if (active >= 0) {
      hideAll();
      timer = setTimeout(pop, 280 + Math.random() * 220);
    }
  }, 900 + Math.random() * 500);
}
function hit(i) {
  if (didWin || progress >= NEED) return;
  if (i !== active) { C.sfxBad(); C.toast('等地鼠出嚟', true); return; }
  const m = moles[i];
  m.classList.add('hit');
  C.sfxOk(); C.toast('打中！');
  progress += 1; C.setProgress(progress, NEED);
  active = -1;
  clearTimeout(timer);
  setTimeout(() => {
    hideAll();
    if (progress >= NEED) setTimeout(win, 280);
    else timer = setTimeout(pop, 350);
  }, 180);
}
function win() {
  clearTimeout(timer);
  C.finishClear({ gid: GID, progress, label: '打地鼠', displayName, setDidWin: v => { didWin = v; } });
}
function start() {
  clearTimeout(timer);
  didWin = false; progress = 0; C.setProgress(0, NEED);
  build(); hideAll();
  if (MouseHubReward && MouseHubReward.autoSpeak()) C.speak('地鼠出嚟就撳');
  timer = setTimeout(pop, 500);
}
C.wireChrome({ gid: GID, speakText: '地鼠出嚟就撳', didWin: () => didWin, onRetry: start });
start();
</script>
</body>
</html>
