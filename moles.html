<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>打地鼠｜將軍澳培智學校</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:"PingFang HK","Noto Sans TC",system-ui,sans-serif;color:#3D2B5A;
background:#7CB342;background-image:
radial-gradient(ellipse 120% 80% at 50% 100%,#8BC34A 0%,#689F38 45%,#558B2F 100%),
repeating-linear-gradient(90deg,transparent 0 18px,rgba(255,255,255,.04) 18px 19px);
-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation;overflow:hidden}
button{font:inherit;border:none;cursor:pointer}
.top{height:60px;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 12px;background:rgba(255,255,255,.94);border-bottom:3px solid #F9A825;box-shadow:0 4px 16px rgba(0,0,0,.12)}
.who{display:flex;align-items:center;gap:8px;font-weight:900}
.av{width:40px;height:40px;border-radius:50%;border:3px solid #F9A825;display:grid;place-items:center;font-size:1.3rem;background:#FFF8E1}
.hint{flex:1;text-align:center;font-size:clamp(1.05rem,2.3vw,1.45rem);font-weight:900}
.hint b{background:#FFD54F;padding:2px 8px;border-radius:8px;box-shadow:inset 0 -2px 0 rgba(0,0,0,.08)}
.icon{width:46px;height:46px;border-radius:14px;background:#fff;border:3px solid rgba(61,43,90,.12);font-size:1.15rem;font-weight:900}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.stage{height:calc(100% - 60px);position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;padding:16px}
.meter-wrap{position:absolute;left:12px;right:12px;top:10px;z-index:5;display:flex;align-items:center;gap:10px;pointer-events:none}
.meter{flex:1;height:18px;border-radius:999px;background:rgba(0,0,0,.18);overflow:hidden;border:2px solid rgba(255,255,255,.35)}
.meter>i{display:block;height:100%;width:0;background:linear-gradient(90deg,#FFD54F,#FF6F00);transition:width .2s;box-shadow:0 0 12px #FFD54F}
.m-lab{font-weight:900;letter-spacing:1px;font-size:1.15rem;color:#fff;text-shadow:0 2px 4px rgba(0,0,0,.35)}
.guide{position:absolute;left:12px;bottom:12px;z-index:5;background:rgba(255,255,255,.96);border:3px solid #F9A825;border-radius:16px;padding:8px 14px;font-weight:900;max-width:88%;box-shadow:0 6px 18px rgba(0,0,0,.12)}
.toast{position:fixed;left:50%;top:14%;transform:translateX(-50%) scale(.92);background:#fff;border:4px solid #22c55e;color:#166534;font-size:1.35rem;font-weight:900;padding:12px 20px;border-radius:999px;opacity:0;pointer-events:none;transition:.2s;z-index:40}
.toast.show{opacity:1;transform:translateX(-50%) scale(1)}.toast.bad{border-color:#FF6B9D;color:#9f1239}
.overlay{position:fixed;inset:0;background:rgba(61,43,90,.5);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.overlay.on{display:flex}
.modal{width:min(440px,94vw);background:#fff;border:5px solid #FFD54F;border-radius:28px;padding:22px 16px;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.modal h2{font-size:1.9rem;margin-bottom:6px}.modal p{font-weight:800;opacity:.8;margin-bottom:12px}
.btn{min-height:54px;min-width:120px;padding:12px 16px;border-radius:999px;background:linear-gradient(135deg,#F9A825,#FF6F00);color:#fff;font-size:1.15rem;font-weight:900}
.btn.ghost{background:#fff;color:#3D2B5A;border:3px solid rgba(61,43,90,.12)}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:45;overflow:hidden}
.confetti i{position:absolute;top:-16px;width:10px;height:16px;border-radius:3px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.combo{position:absolute;top:44px;right:14px;z-index:6;font-size:clamp(1.2rem,3.5vw,1.7rem);font-weight:900;color:#FFD54F;text-shadow:0 2px 0 #E65100,0 4px 12px rgba(0,0,0,.35);opacity:0;transform:scale(.8);transition:.15s;pointer-events:none}
.combo.on{opacity:1;transform:scale(1.1)}
.board{width:min(560px,94vw);margin-top:36px;padding:18px 14px 22px;border-radius:28px;background:linear-gradient(180deg,#A1887F,#795548 40%,#5D4037);
border:6px solid #4E342E;box-shadow:inset 0 8px 0 rgba(255,255,255,.12),0 16px 32px rgba(0,0,0,.28)}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(12px,3vw,20px)}
.hole{aspect-ratio:1;border-radius:50%;position:relative;overflow:hidden;
background:radial-gradient(circle at 50% 35%,#3E2723 0%,#1B0F0A 70%);
border:5px solid #2E1A12;box-shadow:inset 0 14px 22px rgba(0,0,0,.55),0 0 0 3px #8D6E63}
.hole::after{content:"";position:absolute;left:6%;right:6%;bottom:0;height:28%;background:linear-gradient(180deg,#A1887F,#6D4C41);border-radius:50% 50% 0 0;z-index:3;pointer-events:none;box-shadow:0 -2px 6px rgba(0,0,0,.2)}
.mole{position:absolute;left:50%;bottom:-85%;transform:translateX(-50%);width:78%;z-index:2;
display:flex;flex-direction:column;align-items:center;transition:bottom .16s cubic-bezier(.2,1.4,.4,1);cursor:pointer;background:transparent;border:none;padding:0;touch-action:manipulation}
.mole.up{bottom:6%}
.mole.hit{filter:brightness(1.35) drop-shadow(0 0 14px #FFD54F);transform:translateX(-50%) scale(1.12);transition:bottom .12s ease,transform .12s}
.mole .face{font-size:clamp(2.2rem,9vw,3.4rem);line-height:1;filter:drop-shadow(0 4px 6px rgba(0,0,0,.35));pointer-events:none}
.mole .body{width:70%;height:28px;margin-top:-8px;border-radius:40% 40% 20% 20%;background:linear-gradient(180deg,#A1887F,#6D4C41);border:3px solid #4E342E;pointer-events:none}
.bang{position:absolute;left:50%;top:20%;transform:translate(-50%,-50%) scale(0);font-size:1.6rem;font-weight:900;color:#FFD54F;text-shadow:0 2px 0 #E65100;z-index:8;pointer-events:none;opacity:0}
.bang.on{animation:bang .45s ease forwards}
@keyframes bang{0%{opacity:1;transform:translate(-50%,-50%) scale(.4)}60%{opacity:1;transform:translate(-50%,-80%) scale(1.3)}100%{opacity:0;transform:translate(-50%,-120%) scale(1)}}
.sun{position:absolute;top:52px;left:18px;width:54px;height:54px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#FFF59D,#FBC02D);box-shadow:0 0 30px #FFD54F;opacity:.9;z-index:1;pointer-events:none}
.cloud{position:absolute;top:58px;font-size:2rem;opacity:.55;z-index:1;pointer-events:none;animation:drift 14s linear infinite}
@keyframes drift{from{transform:translateX(0)}to{transform:translateX(30px)}}
</style>
</head>
<body>
<div class="toast" id="toast"></div>
<div class="confetti" id="confetti"></div>
<div class="top">
  <div class="who"><div class="av" id="av">🐱</div><span id="whoName">同學</span></div>
  <div class="hint" id="hint">地鼠出嚟 · 左掣 <b>打</b></div>
  <div class="row">
    <button class="icon" id="btnSpeak" type="button">🔊</button>
    <button class="icon" id="btnHub" type="button">🏠</button>
  </div>
</div>
<div class="stage" id="stage">
  <div class="sun"></div>
  <div class="cloud" style="right:12%">☁️</div>
  <div class="cloud" style="left:22%;top:72px;animation-delay:-5s;font-size:1.5rem">☁️</div>
  <div class="meter-wrap"><div class="meter"><i id="fill"></i></div><div class="m-lab" id="mlab">0/5</div></div>
  <div class="combo" id="combo">連撃 ×2</div>
  <div class="guide" id="guide">彈出就快打！連撃更快更閃</div>
  <div class="board"><div class="grid" id="grid"></div></div>
</div>
<div class="overlay" id="win">
  <div class="modal">
    <div style="font-size:2.4rem" id="winMedal">🥇</div>
    <h2>做得好！</h2>
    <p id="winMsg">完成</p>
    <div class="row">
      <button class="btn ghost" id="btnRetry" type="button">再玩</button>
      <button class="btn" id="btnCert" type="button">證書</button>
      <button class="btn" id="btnNext" type="button">下一個</button>
      <button class="btn ghost" id="btnHub2" type="button">主頁</button>
    </div>
  </div>
</div>
<script src="./reward.js"></script>
<script src="./cert.js"></script>
<script src="./common.js"></script>
<script>
const C = MouseHubCommon, NEED = 5, GID = 'moles';
const $ = C.$, grid = $('grid'), comboEl = $('combo');
const FACES = ['🐹','🐭','🐿️','🦫','🐰','🦔'];
let progress = 0, didWin = false, timer = 0, active = -1, moles = [], streak = 0, lastHit = 0;
const displayName = C.loadProfile();
C.lockSEN(); C.armAudioOnce();

function build() {
  grid.innerHTML = ''; moles = [];
  for (let i = 0; i < 9; i++) {
    const hole = document.createElement('div'); hole.className = 'hole';
    const m = document.createElement('button'); m.type = 'button'; m.className = 'mole';
    m.innerHTML = '<span class="face">' + FACES[i % FACES.length] + '</span><span class="body"></span>';
    m.setAttribute('aria-label', '地鼠');
    const bang = document.createElement('div'); bang.className = 'bang'; bang.textContent = '💥';
    m.addEventListener('click', e => { e.preventDefault(); hit(i); });
    m.addEventListener('pointerdown', e => { if (e.button === 0) { e.preventDefault(); hit(i); } });
    hole.appendChild(m); hole.appendChild(bang); grid.appendChild(hole);
    moles.push({ btn: m, bang, hole });
  }
}
function hideAll() {
  active = -1;
  moles.forEach(m => m.btn.classList.remove('up', 'hit'));
}
function showCombo() {
  if (streak < 2) { comboEl.classList.remove('on'); return; }
  comboEl.textContent = '連撃 ×' + streak + (streak >= 3 ? ' 🔥' : '');
  comboEl.classList.add('on');
  clearTimeout(comboEl._t);
  comboEl._t = setTimeout(() => comboEl.classList.remove('on'), 900);
}
function upTime() { return Math.max(520, 980 - progress * 70 - streak * 40); }
function gapTime() { return Math.max(180, 320 - progress * 20); }
function pop() {
  if (didWin || progress >= NEED) return;
  hideAll();
  active = Math.floor(Math.random() * 9);
  moles[active].btn.classList.add('up');
  moles[active].btn.querySelector('.face').textContent = FACES[Math.floor(Math.random() * FACES.length)];
  clearTimeout(timer);
  timer = setTimeout(() => {
    if (active >= 0) {
      streak = 0; hideAll();
      timer = setTimeout(pop, gapTime() + Math.random() * 160);
    }
  }, upTime());
}
function hit(i) {
  if (didWin || progress >= NEED) return;
  if (i !== active) { C.sfxBad(); C.toast('等地鼠', true); streak = 0; return; }
  const now = Date.now();
  streak = (now - lastHit < 1400) ? streak + 1 : 1;
  lastHit = now; showCombo();
  const m = moles[i];
  m.btn.classList.add('hit'); m.bang.classList.remove('on'); void m.bang.offsetWidth; m.bang.classList.add('on');
  C.sfxOk(); C.toast(streak >= 3 ? '超準！' : '打中！');
  progress += 1; C.setProgress(progress, NEED);
  active = -1; clearTimeout(timer);
  setTimeout(() => {
    hideAll();
    if (progress >= NEED) setTimeout(win, 280);
    else timer = setTimeout(pop, 220 + gapTime());
  }, 160);
}
function win() {
  clearTimeout(timer);
  C.finishClear({ gid: GID, progress, label: '打地鼠', displayName, setDidWin: v => { didWin = v; } });
}
function start() {
  clearTimeout(timer);
  didWin = false; progress = 0; streak = 0; lastHit = 0;
  C.setProgress(0, NEED); comboEl.classList.remove('on');
  build(); hideAll();
  if (MouseHubReward && MouseHubReward.autoSpeak()) C.speak('地鼠出嚟就撳');
  timer = setTimeout(pop, 480);
}
C.wireChrome({ gid: GID, speakText: '地鼠出嚟就撳', didWin: () => didWin, onRetry: start });
start();
</script>
</body>
</html>
