<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>打地鼠｜將軍澳培智學校</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:"PingFang HK","Noto Sans TC",system-ui,sans-serif;color:#3D2B5A;
background:linear-gradient(180deg,#E8F5E9,#C8E6C9 40%,#A5D6A7);
-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation;overflow:hidden}
button{font:inherit;border:none;cursor:pointer}
.top{height:60px;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 12px;background:rgba(255,255,255,.92);border-bottom:3px solid #43A04755}
.who{display:flex;align-items:center;gap:8px;font-weight:900}
.av{width:40px;height:40px;border-radius:50%;border:3px solid #43A047;display:grid;place-items:center;font-size:1.3rem;background:#fff}
.hint{flex:1;text-align:center;font-size:clamp(1.05rem,2.3vw,1.45rem);font-weight:900}
.hint b{background:#FFD54F;padding:2px 8px;border-radius:8px}
.icon{width:46px;height:46px;border-radius:14px;background:#fff;border:3px solid rgba(61,43,90,.12);font-size:1.15rem;font-weight:900}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.stage{height:calc(100% - 60px);position:relative;overflow:hidden;padding:12px}
.meter-wrap{position:absolute;left:12px;right:12px;top:10px;z-index:5;display:flex;align-items:center;gap:10px;pointer-events:none}
.meter{flex:1;height:16px;border-radius:999px;background:rgba(61,43,90,.12);overflow:hidden}
.meter>i{display:block;height:100%;width:0;background:linear-gradient(90deg,#69F0AE,#43A047);transition:width .2s}
.m-lab{font-weight:900;letter-spacing:1px;font-size:1.1rem}
.guide{position:absolute;left:12px;bottom:12px;z-index:5;background:rgba(255,255,255,.95);border:3px solid #43A047;border-radius:16px;padding:8px 12px;font-weight:900;max-width:85%}
.toast{position:fixed;left:50%;top:14%;transform:translateX(-50%) scale(.92);background:#fff;border:4px solid #22c55e;color:#166534;font-size:1.35rem;font-weight:900;padding:12px 20px;border-radius:999px;opacity:0;pointer-events:none;transition:.2s;z-index:40}
.toast.show{opacity:1;transform:translateX(-50%) scale(1)}.toast.bad{border-color:#FF6B9D;color:#9f1239}
.overlay{position:fixed;inset:0;background:rgba(61,43,90,.45);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.overlay.on{display:flex}
.modal{width:min(440px,94vw);background:#fff;border:5px solid #FFD54F;border-radius:28px;padding:22px 16px;text-align:center}
.modal h2{font-size:1.9rem;margin-bottom:6px}.modal p{font-weight:800;opacity:.8;margin-bottom:12px}
.btn{min-height:54px;min-width:120px;padding:12px 16px;border-radius:999px;background:linear-gradient(135deg,#43A047,#FFD54F);color:#fff;font-size:1.15rem;font-weight:900}
.btn.ghost{background:#fff;color:#3D2B5A;border:3px solid rgba(61,43,90,.12)}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:45;overflow:hidden}
.confetti i{position:absolute;top:-16px;width:10px;height:16px;border-radius:3px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.grid{position:absolute;inset:56px 16px 72px;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(2,1fr);gap:14px;z-index:2}
.hole{position:relative;border-radius:50%;background:radial-gradient(circle at 50% 40%,#5D4037,#3E2723);border:5px solid #2E1A12;box-shadow:inset 0 12px 20px rgba(0,0,0,.35);overflow:hidden;display:grid;place-items:end center}
.mole{width:78%;aspect-ratio:1;border-radius:50% 50% 42% 42%;background:linear-gradient(180deg,#A1887F,#6D4C41);border:4px solid #4E342E;display:grid;place-items:center;font-size:clamp(1.8rem,5vw,2.6rem);transform:translateY(110%);transition:transform .18s ease-out;cursor:pointer;touch-action:manipulation;user-select:none}
.mole.up{transform:translateY(8%)}.mole.bonk{transform:translateY(110%) scale(.85);filter:brightness(1.2)}
.dirt{position:absolute;left:8%;right:8%;bottom:0;height:22%;background:#8D6E63;border-radius:40% 40% 0 0;z-index:1;pointer-events:none}
</style>
</head>
<body>
<div class="toast" id="toast"></div>
<div class="confetti" id="confetti"></div>
<div class="top">
  <div class="who"><div class="av" id="av">🐱</div><span id="whoName">同學</span></div>
  <div class="hint" id="hint">左掣打 <b>地鼠</b></div>
  <div class="row">
    <button class="icon" id="btnSpeak" type="button">🔊</button>
    <button class="icon" id="btnHub" type="button">🏠</button>
  </div>
</div>
<div class="stage" id="stage">
  <div class="meter-wrap"><div class="meter"><i id="fill"></i></div><div class="m-lab" id="mlab">0/5</div></div>
  <div class="grid" id="grid"></div>
  <div class="guide" id="guide">地鼠鑽出嚟就快啲左掣撳！</div>
</div>
<div class="overlay" id="win">
  <div class="modal">
    <div style="font-size:2.4rem" id="winMedal">🥇</div>
    <h2>做得好！</h2>
    <p id="winMsg">完成</p>
    <div class="row">
      <button class="btn ghost" id="btnRetry" type="button">再玩</button>
      <button class="btn" id="btnCert" type="button">證書</button>
      <button class="btn" id="btnNext" type="button">下一個</button>
      <button class="btn ghost" id="btnHub2" type="button">主頁</button>
    </div>
  </div>
</div>
<script src="./reward.js"></script>
<script src="./cert.js"></script>
<script src="./common.js"></script>
<script>
const C = MouseHubCommon, NEED = 5, GID = 'moles', N = 6;
const $ = C.$, grid = $('grid');
let progress = 0, didWin = false, holes = [], active = -1, tPop = 0, tHide = 0;
const faces = ['🐹','🐭','🐿️','🦫','🦔','🐰'];
const displayName = C.loadProfile();
C.lockSEN(); C.armAudioOnce();

function build() {
  grid.innerHTML = ''; holes = [];
  for (let i = 0; i < N; i++) {
    const hole = document.createElement('div'); hole.className = 'hole';
    const mole = document.createElement('button'); mole.type = 'button'; mole.className = 'mole';
    mole.textContent = faces[i % faces.length]; mole.dataset.i = String(i);
    const dirt = document.createElement('div'); dirt.className = 'dirt';
    mole.addEventListener('click', e => { e.preventDefault(); bonk(+mole.dataset.i); });
    mole.addEventListener('pointerdown', e => { if (e.button === 0) { e.preventDefault(); bonk(+mole.dataset.i); } });
    hole.appendChild(mole); hole.appendChild(dirt); grid.appendChild(hole);
    holes.push(mole);
  }
}
function clearTimers() {
  clearTimeout(tPop); clearTimeout(tHide);
  holes.forEach(m => m.classList.remove('up', 'bonk'));
  active = -1;
}
function schedule() {
  if (didWin || progress >= NEED) return;
  clearTimeout(tPop);
  tPop = setTimeout(pop, 450 + Math.random() * 500);
}
function pop() {
  if (didWin || progress >= NEED) return;
  holes.forEach(m => m.classList.remove('up', 'bonk'));
  active = Math.floor(Math.random() * N);
  holes[active].classList.add('up');
  clearTimeout(tHide);
  tHide = setTimeout(() => {
    if (active >= 0 && holes[active]) holes[active].classList.remove('up');
    active = -1;
    schedule();
  }, 1100 + Math.random() * 400);
}
function bonk(i) {
  if (didWin || progress >= NEED) return;
  if (i !== active || !holes[i].classList.contains('up')) {
    C.sfxBad(); C.toast('等佢出嚟', true); return;
  }
  clearTimeout(tHide);
  holes[i].classList.add('bonk'); holes[i].classList.remove('up');
  active = -1;
  C.sfxOk(); C.toast('打中！');
  progress += 1; C.setProgress(progress, NEED);
  if (progress >= NEED) setTimeout(win, 320); else schedule();
}
function win() {
  clearTimers();
  C.finishClear({ gid: GID, progress, label: '打地鼠', displayName, setDidWin: v => { didWin = v; } });
}
function start() {
  didWin = false; progress = 0; C.setProgress(0, NEED); clearTimers(); build(); schedule();
  if (MouseHubReward && MouseHubReward.autoSpeak()) C.speak('左掣打地鼠');
}
C.wireChrome({ gid: GID, speakText: '左掣打地鼠', didWin: () => didWin, onRetry: start });
start();
</script>
</body>
</html>
