<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>太空入侵｜將軍澳培智學校</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:"PingFang HK","Noto Sans TC",system-ui,sans-serif;color:#E8EAF6;
background:linear-gradient(180deg,#0D1B2A,#1B2838 50%,#0D1B2A);
-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation;overflow:hidden}
button{font:inherit;border:none;cursor:pointer}
.top{height:60px;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 12px;background:rgba(255,255,255,.92);border-bottom:3px solid #00BCD455;color:#3D2B5A}
.who{display:flex;align-items:center;gap:8px;font-weight:900}
.av{width:40px;height:40px;border-radius:50%;border:3px solid #00BCD4;display:grid;place-items:center;font-size:1.3rem;background:#fff}
.hint{flex:1;text-align:center;font-size:clamp(1.05rem,2.3vw,1.45rem);font-weight:900}
.hint b{background:#FFD54F;padding:2px 8px;border-radius:8px;color:#3D2B5A}
.icon{width:46px;height:46px;border-radius:14px;background:#fff;border:3px solid rgba(61,43,90,.12);font-size:1.15rem;font-weight:900}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.stage{height:calc(100% - 60px);position:relative;overflow:hidden;cursor:crosshair}
.meter-wrap{position:absolute;left:12px;right:12px;top:10px;z-index:5;display:flex;align-items:center;gap:10px;pointer-events:none;color:#fff}
.meter{flex:1;height:16px;border-radius:999px;background:rgba(255,255,255,.18);overflow:hidden}
.meter>i{display:block;height:100%;width:0;background:linear-gradient(90deg,#69F0AE,#00E5FF);transition:width .2s}
.m-lab{font-weight:900;letter-spacing:1px;font-size:1.1rem}
.guide{position:absolute;left:12px;bottom:12px;z-index:5;background:rgba(255,255,255,.95);border:3px solid #00BCD4;border-radius:16px;padding:8px 12px;font-weight:900;max-width:85%;color:#3D2B5A}
.toast{position:fixed;left:50%;top:14%;transform:translateX(-50%) scale(.92);background:#fff;border:4px solid #22c55e;color:#166534;font-size:1.35rem;font-weight:900;padding:12px 20px;border-radius:999px;opacity:0;pointer-events:none;transition:.2s;z-index:40}
.toast.show{opacity:1;transform:translateX(-50%) scale(1)}.toast.bad{border-color:#FF6B9D;color:#9f1239}
.overlay{position:fixed;inset:0;background:rgba(61,43,90,.45);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.overlay.on{display:flex}
.modal{width:min(440px,94vw);background:#fff;border:5px solid #FFD54F;border-radius:28px;padding:22px 16px;text-align:center;color:#3D2B5A}
.modal h2{font-size:1.9rem;margin-bottom:6px}.modal p{font-weight:800;opacity:.8;margin-bottom:12px}
.btn{min-height:54px;min-width:120px;padding:12px 16px;border-radius:999px;background:linear-gradient(135deg,#00BCD4,#7C4DFF);color:#fff;font-size:1.15rem;font-weight:900}
.btn.ghost{background:#fff;color:#3D2B5A;border:3px solid rgba(61,43,90,.12)}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:45;overflow:hidden}
.confetti i{position:absolute;top:-16px;width:10px;height:16px;border-radius:3px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.stars{position:absolute;inset:0;background:radial-gradient(2px 2px at 20% 30%,#fff,transparent),radial-gradient(2px 2px at 70% 20%,#fff,transparent),radial-gradient(1px 1px at 40% 70%,#fff,transparent),radial-gradient(2px 2px at 85% 55%,#fff,transparent);opacity:.5;pointer-events:none}
.alien{position:absolute;font-size:clamp(2rem,5vw,2.8rem);line-height:1;z-index:3;filter:drop-shadow(0 0 8px #00E5FF);transition:opacity .12s}
.ship{position:absolute;bottom:56px;width:64px;height:40px;margin-left:-32px;font-size:2.4rem;line-height:1;z-index:4;text-align:center;pointer-events:none;filter:drop-shadow(0 0 10px #69F0AE)}
.bolt{position:absolute;width:6px;height:18px;border-radius:4px;background:#FFD54F;box-shadow:0 0 10px #FFD54F;z-index:3;pointer-events:none}
</style>
</head>
<body>
<div class="toast" id="toast"></div>
<div class="confetti" id="confetti"></div>
<div class="top">
  <div class="who"><div class="av" id="av">🐱</div><span id="whoName">同學</span></div>
  <div class="hint" id="hint">移船 · 左掣 <b>射</b></div>
  <div class="row">
    <button class="icon" id="btnSpeak" type="button">🔊</button>
    <button class="icon" id="btnHub" type="button">🏠</button>
  </div>
</div>
<div class="stage" id="stage">
  <div class="stars"></div>
  <div class="meter-wrap"><div class="meter"><i id="fill"></i></div><div class="m-lab" id="mlab">0/5</div></div>
  <div class="ship" id="ship">🚀</div>
  <div class="guide" id="guide">左右移滑鼠對準，左掣射外星人！</div>
</div>
<div class="overlay" id="win">
  <div class="modal">
    <div style="font-size:2.4rem" id="winMedal">🥇</div>
    <h2>做得好！</h2>
    <p id="winMsg">完成</p>
    <div class="row">
      <button class="btn ghost" id="btnRetry" type="button">再玩</button>
      <button class="btn" id="btnCert" type="button">證書</button>
      <button class="btn" id="btnNext" type="button">下一個</button>
      <button class="btn ghost" id="btnHub2" type="button">主頁</button>
    </div>
  </div>
</div>
<script src="./reward.js"></script>
<script src="./cert.js"></script>
<script src="./common.js"></script>
<script>
const C = MouseHubCommon, NEED = 5, GID = 'invaders';
const $ = C.$, stage = $('stage'), ship = $('ship');
let progress = 0, didWin = false, raf = 0, mx = innerWidth / 2;
let aliens = [], bolts = [], lastShot = 0;
const faces = ['👾','👽','🛸','👹','🤖'];
const displayName = C.loadProfile();
C.lockSEN(); C.armAudioOnce();

window.addEventListener('pointermove', e => {
  mx = Math.max(40, Math.min(innerWidth - 40, e.clientX));
  ship.style.left = mx + 'px';
});
stage.addEventListener('pointerdown', e => {
  if (e.button !== 0 || didWin) return;
  e.preventDefault();
  shoot();
});

function clearField() {
  aliens.forEach(a => a.el && a.el.remove());
  bolts.forEach(b => b.el && b.el.remove());
  aliens = []; bolts = [];
  if (raf) { cancelAnimationFrame(raf); raf = 0; }
}
function spawnRow() {
  const cols = 5, top = 70, gap = Math.min(90, (innerWidth - 80) / cols);
  const startX = (innerWidth - gap * (cols - 1)) / 2;
  for (let i = 0; i < cols; i++) {
    const el = document.createElement('div');
    el.className = 'alien';
    el.textContent = faces[i % faces.length];
    const x = startX + i * gap, y = top + (i % 2) * 10;
    el.style.left = x + 'px'; el.style.top = y + 'px';
    stage.appendChild(el);
    aliens.push({ el, x, y, alive: true, dir: 1, speed: 0.55 + progress * 0.08 });
  }
}
function ensureAliens() {
  if (aliens.filter(a => a.alive).length === 0 && !didWin && progress < NEED) spawnRow();
}
function shoot() {
  const now = performance.now();
  if (now - lastShot < 280) return;
  lastShot = now;
  const el = document.createElement('div'); el.className = 'bolt';
  const x = mx - 3, y = stage.getBoundingClientRect().bottom - 60 - 60;
  el.style.left = x + 'px'; el.style.top = y + 'px';
  stage.appendChild(el);
  bolts.push({ el, x, y });
  C.tone(660, 0.06, 'square', 0.08);
}
function hitAlien(a) {
  a.alive = false; a.el.style.opacity = '0';
  setTimeout(() => { if (a.el) a.el.remove(); }, 120);
  C.sfxOk(); C.toast('擊中！');
  progress += 1; C.setProgress(progress, NEED);
  if (progress >= NEED) { setTimeout(win, 280); return; }
  ensureAliens();
}
function tick() {
  if (didWin) return;
  const sh = stage.getBoundingClientRect();
  aliens.forEach(a => {
    if (!a.alive) return;
    a.x += a.dir * a.speed;
    if (a.x < 24) { a.x = 24; a.dir = 1; a.y += 18; }
    if (a.x > sh.width - 48) { a.x = sh.width - 48; a.dir = -1; a.y += 18; }
    a.el.style.left = a.x + 'px'; a.el.style.top = a.y + 'px';
  });
  bolts = bolts.filter(b => {
    b.y -= 10;
    b.el.style.top = b.y + 'px';
    if (b.y < 0) { b.el.remove(); return false; }
    for (const a of aliens) {
      if (!a.alive) continue;
      if (Math.abs((a.x + 20) - (b.x + 3)) < 34 && Math.abs((a.y + 20) - b.y) < 30) {
        b.el.remove(); hitAlien(a); return false;
      }
    }
    return true;
  });
  raf = requestAnimationFrame(tick);
}
function win() {
  clearField();
  C.finishClear({ gid: GID, progress, label: '太空入侵', displayName, setDidWin: v => { didWin = v; } });
}
function start() {
  didWin = false; progress = 0; C.setProgress(0, NEED); clearField();
  ship.style.left = mx + 'px'; spawnRow(); raf = requestAnimationFrame(tick);
  if (MouseHubReward && MouseHubReward.autoSpeak()) C.speak('移船再射');
}
C.wireChrome({ gid: GID, speakText: '移船再射', didWin: () => didWin, onRetry: start });
start();
</script>
</body>
</html>
