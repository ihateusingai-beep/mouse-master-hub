<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>太空入侵｜將軍澳培智學校</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:"PingFang HK","Noto Sans TC",system-ui,sans-serif;color:#E0F7FA;
background:#050B18;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation;overflow:hidden}
button{font:inherit;border:none;cursor:pointer}
.top{height:52px;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:4px 10px;background:linear-gradient(180deg,#0A1628,#07101C);border-bottom:2px solid #00E5FF66;color:#E0F7FA}
.who{display:flex;align-items:center;gap:8px;font-weight:900}
.av{width:36px;height:36px;border-radius:50%;border:3px solid #00E5FF;display:grid;place-items:center;font-size:1.15rem;background:#102A43}
.hint{flex:1;text-align:center;font-size:clamp(.9rem,2vw,1.25rem);font-weight:900}
.hint b{background:#FFD54F;color:#1A237E;padding:2px 8px;border-radius:8px}
.icon{width:42px;height:42px;border-radius:14px;background:#102A43;border:2px solid #00E5FF66;font-size:1.05rem;font-weight:900;color:#E0F7FA}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.diffbar{height:46px;display:flex;align-items:center;justify-content:center;gap:8px;padding:4px 10px;background:#07101C;border-bottom:1px solid #00E5FF33}
.diffbtn{min-height:38px;min-width:70px;padding:6px 14px;border-radius:999px;font-weight:900;font-size:1.05rem;background:#102A43;color:#90CAF9;border:2px solid #00E5FF44}
.diffbtn.on{background:linear-gradient(135deg,#00BCD4,#7C4DFF);color:#fff;border-color:#FFD54F;box-shadow:0 0 14px #00E5FF66}
.stage{height:calc(100% - 98px);position:relative;overflow:hidden;background:
radial-gradient(ellipse 80% 50% at 50% 0%,#1A237E55,transparent 60%),
linear-gradient(180deg,#050B18 0%,#0D1B2A 50%,#06101C 100%)}
.stage.shake{animation:shake .2s ease}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.stage::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent 0 3px,rgba(0,229,255,.03) 3px 4px);pointer-events:none;z-index:9}
.meter-wrap{position:absolute;left:10px;right:10px;top:8px;z-index:5;display:flex;align-items:center;gap:8px;pointer-events:none}
.meter{flex:1;height:14px;border-radius:999px;background:rgba(255,255,255,.1);overflow:hidden;border:1px solid #00E5FF44}
.meter>i{display:block;height:100%;width:0;background:linear-gradient(90deg,#69F0AE,#00E5FF);transition:width .15s;box-shadow:0 0 10px #00E5FF}
.m-lab{font-weight:900;letter-spacing:1px;font-size:.95rem;color:#E0F7FA;text-shadow:0 0 8px #00E5FF;white-space:nowrap}
.guide{position:absolute;left:10px;bottom:10px;z-index:5;background:rgba(10,22,40,.92);border:2px solid #00E5FF;border-radius:14px;padding:7px 11px;font-weight:900;max-width:62%;color:#E0F7FA;font-size:.95rem}
.toast{position:fixed;left:50%;top:15%;transform:translateX(-50%) scale(.92);background:#fff;border:4px solid #22c55e;color:#166534;font-size:1.3rem;font-weight:900;padding:12px 18px;border-radius:999px;opacity:0;pointer-events:none;transition:.2s;z-index:40}
.toast.show{opacity:1;transform:translateX(-50%) scale(1)}.toast.bad{border-color:#FF6B9D;color:#9f1239}
.overlay{position:fixed;inset:0;background:rgba(5,11,24,.72);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.overlay.on{display:flex}
.modal{width:min(440px,94vw);background:#fff;border:5px solid #FFD54F;border-radius:28px;padding:22px 16px;text-align:center;color:#3D2B5A}
.modal h2{font-size:1.9rem;margin-bottom:6px}.modal p{font-weight:800;opacity:.8;margin-bottom:12px}
.btn{min-height:54px;min-width:120px;padding:12px 16px;border-radius:999px;background:linear-gradient(135deg,#00BCD4,#7C4DFF);color:#fff;font-size:1.15rem;font-weight:900}
.btn.ghost{background:#fff;color:#3D2B5A;border:3px solid rgba(61,43,90,.12)}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:45;overflow:hidden}
.confetti i{position:absolute;top:-16px;width:10px;height:16px;border-radius:3px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.stars{position:absolute;inset:0;pointer-events:none;z-index:0;opacity:.65;
background-image:radial-gradient(1.5px 1.5px at 12% 18%,#fff,transparent),radial-gradient(2px 2px at 28% 42%,#fff,transparent),radial-gradient(1px 1px at 55% 12%,#fff,transparent),radial-gradient(2px 2px at 72% 38%,#A5F3FC,transparent),radial-gradient(1px 1px at 88% 22%,#fff,transparent),radial-gradient(1.5px 1.5px at 40% 68%,#fff,transparent)}
.alien{position:absolute;font-size:clamp(1.55rem,5.2vw,2.35rem);line-height:1;z-index:3;filter:drop-shadow(0 0 8px #69F0AE);transition:opacity .1s,transform .1s;will-change:transform;pointer-events:none}
.alien.dead{opacity:0;transform:scale(1.4) rotate(12deg)}
.ship-wrap{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);z-index:6;pointer-events:none;display:flex;flex-direction:column;align-items:center}
.ship{font-size:2.5rem;line-height:1;filter:drop-shadow(0 0 14px #00E5FF);animation:hover 1.6s ease-in-out infinite;transform-origin:50% 70%}
@keyframes hover{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
.ship-glow{width:44px;height:8px;border-radius:50%;background:radial-gradient(ellipse,#00E5FF88,transparent);margin-top:-3px}
.laser{position:absolute;width:5px;height:22px;border-radius:4px;background:linear-gradient(#fff,#00E5FF 40%,#FFD54F);box-shadow:0 0 12px #00E5FF;z-index:5;pointer-events:none}
.laser.big{width:7px;height:28px;box-shadow:0 0 18px #FFD54F}
.boom{position:absolute;font-size:1.6rem;z-index:7;pointer-events:none;animation:boom .35s ease forwards}
@keyframes boom{0%{opacity:1;transform:scale(.5)}100%{opacity:0;transform:scale(1.7)}}
.pop{position:absolute;z-index:8;font-weight:900;font-size:1.05rem;color:#FFD54F;text-shadow:0 0 8px #00E5FF;pointer-events:none;animation:pop .5s ease forwards}
@keyframes pop{0%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-32px)}}
.hud-line{position:absolute;left:6%;right:6%;bottom:62px;height:2px;background:linear-gradient(90deg,transparent,#FF6B9D88,transparent);z-index:2;pointer-events:none}
.hud-line::after{content:"防禦線";position:absolute;right:0;top:-16px;font-size:.7rem;font-weight:900;color:#FF6B9D;opacity:.85}
.wave{position:absolute;top:36px;left:50%;transform:translateX(-50%);font-weight:900;font-size:.9rem;color:#00E5FF;letter-spacing:1px;z-index:5;pointer-events:none;text-shadow:0 0 8px #00E5FF}
.combo{position:absolute;top:56px;right:10px;z-index:6;font-size:clamp(1rem,2.8vw,1.4rem);font-weight:900;color:#FFD54F;text-shadow:0 0 10px #FF6B9D;opacity:0;transform:scale(.8);transition:.15s;pointer-events:none}
.combo.on{opacity:1;transform:scale(1.1)}
.wave-clear{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%) scale(.85);z-index:12;background:rgba(10,22,40,.94);border:3px solid #FFD54F;color:#FFD54F;font-weight:900;font-size:clamp(1.15rem,3.5vw,1.65rem);padding:12px 18px;border-radius:18px;opacity:0;pointer-events:none;transition:.2s;text-align:center;box-shadow:0 0 28px #00E5FF55}
.wave-clear.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
.sweep{position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(0,229,255,.22),transparent);z-index:11;pointer-events:none;opacity:0}
.sweep.on{animation:sweep .5s ease forwards}
@keyframes sweep{0%{opacity:0;transform:translateX(-40%)}40%{opacity:1}100%{opacity:0;transform:translateX(40%)}}
.aimbar{position:absolute;left:50%;bottom:6px;transform:translateX(-50%);z-index:8;display:none;gap:10px}
.aimbar.on{display:flex}
.aimbtn{width:60px;height:48px;border-radius:14px;background:#102A43;border:3px solid #00E5FF;color:#E0F7FA;font-size:1.4rem;font-weight:900}
.aimbtn.on{background:linear-gradient(135deg,#00BCD4,#FFD54F);color:#1A237E;border-color:#FFD54F}
.ufo{position:absolute;top:48px;font-size:clamp(1.8rem,5vw,2.4rem);z-index:4;filter:drop-shadow(0 0 12px #FFD54F);pointer-events:none;line-height:1}
.bunker{position:absolute;z-index:4;width:72px;height:36px;border-radius:8px 8px 4px 4px;background:linear-gradient(180deg,#69F0AE,#2E7D32);border:2px solid #A5D6A7;box-shadow:inset 0 2px 0 rgba(255,255,255,.25);opacity:.95}
.bunker.d2{background:linear-gradient(180deg,#AED581,#558B2F);opacity:.85}
.bunker.d1{background:linear-gradient(180deg,#9E9E9E,#616161);opacity:.7;height:28px}
.bunker.dead{opacity:0;pointer-events:none}
.heart{position:absolute;left:10px;top:56px;z-index:5;font-size:.85rem;font-weight:900;color:#80DEEA;letter-spacing:1px;pointer-events:none;opacity:.9}
</style>
</head>
<body>
<div class="toast" id="toast"></div>
<div class="confetti" id="confetti"></div>
<div class="top">
  <div class="who"><div class="av" id="av">🐱</div><span id="whoName">同學</span></div>
  <div class="hint" id="hint">移船對準 · <b>射</b></div>
  <div class="row">
    <button class="icon" id="btnSpeak" type="button">🔊</button>
    <button class="icon" id="btnHub" type="button">🏠</button>
  </div>
</div>
<div class="diffbar" id="diffbar" role="group" aria-label="難度">
  <button class="diffbtn on" type="button" data-diff="easy">初</button>
  <button class="diffbtn" type="button" data-diff="mid">中</button>
  <button class="diffbtn" type="button" data-diff="hard">高</button>
</div>
<div class="stage" id="stage">
  <div class="stars"></div>
  <div class="meter-wrap"><div class="meter"><i id="fill"></i></div><div class="m-lab" id="mlab">0/24</div></div>
  <div class="wave" id="wave">WAVE 1/4</div>
  <div class="heart" id="heart">♥ 節奏</div>
  <div class="combo" id="combo">連撃 ×2</div>
  <div class="hud-line" id="defendLine"></div>
  <div class="guide" id="guide">全滅外星人 · 左右移</div>
  <div class="wave-clear" id="waveClear">WAVE CLEAR!</div>
  <div class="sweep" id="sweep"></div>
  <div class="ship-wrap" id="shipWrap"><div class="ship" id="ship">🚀</div><div class="ship-glow"></div></div>
  <div class="aimbar" id="aimbar">
    <button class="aimbtn" type="button" data-aim="-1">↖</button>
    <button class="aimbtn on" type="button" data-aim="0">↑</button>
    <button class="aimbtn" type="button" data-aim="1">↗</button>
  </div>
</div>
<div class="overlay" id="win">
  <div class="modal">
    <div style="font-size:2.4rem" id="winMedal">🥇</div>
    <h2>做得好！</h2>
    <p id="winMsg">完成</p>
    <div class="row">
      <button class="btn ghost" id="btnRetry" type="button">再玩</button>
      <button class="btn" id="btnCert" type="button">證書</button>
      <button class="btn" id="btnNext" type="button">下一個</button>
      <button class="btn ghost" id="btnHub2" type="button">主頁</button>
    </div>
  </div>
</div>
<script src="./reward.js"></script>
<script src="./cert.js"></script>
<script src="./common.js"></script>
<script>
/**
 * Space Invaders SEN port — classic loops adapted:
 * - 1D horizontal ship
 * - matrix march + edge drop
 * - single-shot constraint (mid/hard)
 * - dynamic speed (fewer aliens = faster, heartbeat)
 * - multi-wave loops, lower start each loop
 * - mystery UFO bonus
 * - bunkers on hard (player shots chip them)
 * - NO lives: invasion line = soft reset wave (SEN)
 * - win = clear ALL aliens across all waves
 */
const C = MouseHubCommon, GID = 'invaders';
const $ = C.$, stage = $('stage'), shipWrap = $('shipWrap'), ship = $('ship');
// row faces top→bottom classic-ish: squid / crab / octopus
const ROWS_FACE = ['🦑', '🦀', '🐙', '👾', '👽'];
const ROW_PTS = [30, 20, 20, 10, 10];
const DIFF = {
  // clear ALL: rows*cols*waves
  easy: {
    label: '初', rows: 2, cols: 4, waves: 4, // 32
    auto: true, single: false, snap: false, multi: 1,
    cool: 380, laser: 12, combo: false, bunkers: 0, ufo: true,
    basePeriod: 34, minPeriod: 10, drop: 14,
    speak: '移船對準，自動射，全滅佢哋',
    hint: '左右移 · <b>自動射</b> · 全滅',
    guide: '矩陣外星人 · 自動射 · 清晒先過關！'
  },
  mid: {
    label: '中', rows: 3, cols: 5, waves: 4, // 60
    auto: false, single: true, snap: false, multi: 1,
    cool: 0, laser: 14, combo: true, bunkers: 0, ufo: true,
    basePeriod: 30, minPeriod: 8, drop: 16,
    speak: '移船再射，一次一發',
    hint: '移船 · 左掣 <b>單發射</b> · 全滅',
    guide: '經典單發：子彈在場就唔能再射！'
  },
  hard: {
    label: '高', rows: 3, cols: 6, waves: 5, // 90 — classroom-length
    auto: false, single: true, snap: true, multi: 1,
    cool: 0, laser: 15, combo: true, bunkers: 3, ufo: true,
    basePeriod: 26, minPeriod: 6, drop: 18,
    speak: '轉方向，單發清關',
    hint: '3向瞄 · <b>單發</b> · 掩體 · 全滅',
    guide: '↖↑↗ 瞄準 · 單發 · 掩體可擋 · 清晒！'
  }
};

let diffKey = 'easy', cfg = DIFF.easy, needTotal = 32;
let progress = 0, didWin = false, shipX = 0.5;
let aliens = [], lasers = [], bunkers = [], raf = 0, coolUntil = 0;
let waveIdx = 0, streak = 0, lastKill = 0, aim = 0;
let marchDir = 1, marchN = 0, ufo = null, ufoTimer = 0, shotsFired = 0;
let pauseSpawn = false;
const displayName = C.loadProfile();
C.lockSEN(); C.armAudioOnce();

try {
  const saved = localStorage.getItem('mh_invaders_diff');
  if (saved && DIFF[saved]) diffKey = saved;
} catch (_) {}

function totalNeed() { return cfg.rows * cfg.cols * cfg.waves; }

function applyDiffUI() {
  cfg = DIFF[diffKey];
  needTotal = totalNeed();
  document.querySelectorAll('.diffbtn').forEach(b => b.classList.toggle('on', b.dataset.diff === diffKey));
  $('hint').innerHTML = cfg.hint;
  $('guide').textContent = cfg.guide;
  $('aimbar').classList.toggle('on', cfg.snap);
  document.querySelectorAll('.aimbtn').forEach(b => b.classList.toggle('on', +b.dataset.aim === aim));
  ship.style.transform = 'rotate(' + (aim * 18) + 'deg)';
  C.wireChrome({ gid: GID, speakText: cfg.speak, didWin: () => didWin, onRetry: start });
}

document.querySelectorAll('.diffbtn').forEach(b => {
  b.onclick = () => {
    diffKey = b.dataset.diff;
    try { localStorage.setItem('mh_invaders_diff', diffKey); } catch (_) {}
    start();
  };
});
document.querySelectorAll('.aimbtn').forEach(b => {
  b.addEventListener('pointerdown', e => {
    e.preventDefault(); e.stopPropagation();
    aim = +b.dataset.aim;
    document.querySelectorAll('.aimbtn').forEach(x => x.classList.toggle('on', +x.dataset.aim === aim));
    ship.style.transform = 'rotate(' + (aim * 18) + 'deg)';
    C.tone(700 + aim * 80, 0.05, 'sine', 0.08);
  });
});

window.addEventListener('pointermove', e => {
  if (e.target && e.target.closest && e.target.closest('.diffbar,.aimbar')) return;
  const r = stage.getBoundingClientRect();
  shipX = Math.max(0.07, Math.min(0.93, (e.clientX - r.left) / r.width));
  shipWrap.style.left = (shipX * 100) + '%';
});
function tryShoot(e) {
  if (cfg.auto) return;
  if (e && e.target && e.target.closest && e.target.closest('.diffbar,.aimbar,.top')) return;
  if (e) e.preventDefault();
  shoot();
}
stage.addEventListener('click', tryShoot);
stage.addEventListener('pointerdown', e => { if (e.button === 0) tryShoot(e); });

function clearField() {
  aliens.forEach(a => a.el && a.el.remove());
  lasers.forEach(l => l.el && l.el.remove());
  bunkers.forEach(b => b.el && b.el.remove());
  if (ufo && ufo.el) ufo.el.remove();
  aliens = []; lasers = []; bunkers = []; ufo = null;
  if (raf) { cancelAnimationFrame(raf); raf = 0; }
}

function spawnBunkers() {
  bunkers.forEach(b => b.el && b.el.remove()); bunkers = [];
  if (!cfg.bunkers) return;
  const r = stage.getBoundingClientRect();
  const n = cfg.bunkers;
  const y = r.height - 110;
  for (let i = 0; i < n; i++) {
    const el = document.createElement('div');
    el.className = 'bunker';
    const x = ((i + 1) / (n + 1)) * r.width - 36;
    el.style.left = x + 'px'; el.style.top = y + 'px';
    stage.appendChild(el);
    bunkers.push({ el, x, y, w: 72, h: 36, hp: 3 });
  }
}

function spawnWave() {
  const r = stage.getBoundingClientRect();
  const rows = cfg.rows, cols = cfg.cols;
  const gapX = Math.min(64, (r.width - 48) / Math.max(1, cols));
  const gapY = Math.min(48, Math.max(36, (r.height * 0.28) / Math.max(1, rows)));
  const totalW = gapX * (cols - 1);
  const startX = (r.width - totalW) / 2;
  // classic loop: each wave starts lower
  const y0 = 70 + Math.min(waveIdx, 4) * 10;
  for (let row = 0; row < rows; row++) {
    for (let col = 0; col < cols; col++) {
      const el = document.createElement('div');
      el.className = 'alien';
      const face = ROWS_FACE[Math.min(row, ROWS_FACE.length - 1)];
      el.textContent = face;
      const x = startX + col * gapX;
      const y = y0 + row * gapY;
      el.style.left = x + 'px'; el.style.top = y + 'px';
      stage.appendChild(el);
      aliens.push({
        el, x, y, alive: true, wiggle: col * 0.35 + row,
        row, pts: ROW_PTS[Math.min(row, ROW_PTS.length - 1)], w: 40, h: 40
      });
    }
  }
  waveIdx += 1;
  $('wave').textContent = 'WAVE ' + waveIdx + '/' + cfg.waves;
  marchDir = 1; marchN = 0;
  spawnBunkers();
  pauseSpawn = false;
  beatTone();
}

function aliveCount() { return aliens.filter(a => a.alive).length; }

/** classic dynamic speed: fewer aliens → shorter period */
function marchPeriod() {
  const alive = aliveCount();
  const maxA = cfg.rows * cfg.cols;
  const t = maxA <= 1 ? 0 : (maxA - alive) / (maxA - 1);
  const p = Math.round(cfg.basePeriod - t * (cfg.basePeriod - cfg.minPeriod));
  // last one sprints
  if (alive === 1) return Math.max(4, cfg.minPeriod - 2);
  return Math.max(cfg.minPeriod, p);
}

function beatTone() {
  const alive = aliveCount();
  const f = 180 + (cfg.rows * cfg.cols - alive) * 8;
  C.tone(f, 0.05, 'square', 0.04);
  $('heart').textContent = alive <= 3 ? '♥♥ 快！' : (alive <= 8 ? '♥ 加速' : '♥ 節奏');
}

function showWaveClear(msg) {
  const el = $('waveClear');
  el.textContent = msg || ('WAVE ' + waveIdx + ' CLEAR!');
  el.classList.add('on');
  C.tone(880, 0.1, 'triangle', 0.1);
  setTimeout(() => el.classList.remove('on'), 900);
}

function shake() {
  stage.classList.remove('shake'); void stage.offsetWidth; stage.classList.add('shake');
}
function showCombo() {
  const el = $('combo');
  if (!cfg.combo || streak < 2) { el.classList.remove('on'); return; }
  el.textContent = '連撃 ×' + streak + (streak >= 3 ? ' 🔥' : '');
  el.classList.add('on');
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove('on'), 900);
  if (streak >= 3) {
    const sw = $('sweep');
    sw.classList.remove('on'); void sw.offsetWidth; sw.classList.add('on');
  }
}
function scorePop(x, y, txt) {
  const p = document.createElement('div'); p.className = 'pop'; p.textContent = txt;
  p.style.left = x + 'px'; p.style.top = y + 'px';
  stage.appendChild(p); setTimeout(() => p.remove(), 520);
}

function canShoot() {
  if (didWin || pauseSpawn) return false;
  if (Date.now() < coolUntil) return false;
  // classic single-shot: only one player laser alive
  if (cfg.single && lasers.some(L => L.player)) return false;
  return true;
}

function shoot() {
  if (!canShoot()) return;
  if (!cfg.single && cfg.cool) coolUntil = Date.now() + cfg.cool;
  const r = stage.getBoundingClientRect();
  const sx = shipX * r.width;
  // combo burst on hard/mid: streak>=3 fires 2 for juice, still one "volley" under single if multi=1
  let n = cfg.multi;
  if (cfg.combo && streak >= 3 && !cfg.auto) n = Math.min(3, n + 1);
  shotsFired += 1;
  for (let i = 0; i < n; i++) {
    const el = document.createElement('div');
    el.className = 'laser' + (n > 1 ? ' big' : '');
    const spread = (i - (n - 1) / 2) * 9;
    const ang = (cfg.snap ? aim : 0) * 0.5;
    const speed = cfg.laser;
    const dx = Math.sin(ang) * speed;
    const dy = -Math.cos(ang) * speed;
    el.style.left = (sx - 2.5 + spread) + 'px';
    el.style.top = (r.height - 72) + 'px';
    if (ang) el.style.transform = 'rotate(' + (aim * 18) + 'deg)';
    stage.appendChild(el);
    lasers.push({ el, x: sx + spread, y: r.height - 72, dx, dy, player: true, big: n > 1 });
  }
  C.tone(920, 0.05, 'square', 0.07);
}

function killAlien(a, bonusPts) {
  if (!a.alive) return;
  a.alive = false; a.el.classList.add('dead');
  const boom = document.createElement('div'); boom.className = 'boom';
  boom.textContent = streak >= 3 ? '💥' : '✨';
  boom.style.left = a.x + 'px'; boom.style.top = a.y + 'px';
  stage.appendChild(boom); setTimeout(() => boom.remove(), 380);
  setTimeout(() => { if (a.el.parentNode) a.el.remove(); }, 120);
  const now = Date.now();
  streak = (cfg.combo && now - lastKill < 1500) ? streak + 1 : 1;
  lastKill = now; showCombo(); shake();
  const pts = bonusPts || a.pts || 10;
  C.sfxOk();
  C.toast(streak >= 3 ? '連撃！' : '擊落！');
  scorePop(a.x, a.y, '+' + pts);
  progress += 1;
  C.setProgress(progress, needTotal);
  beatTone();
  if (progress >= needTotal) { setTimeout(win, 280); return; }
  if (aliveCount() === 0) onWaveCleared();
}

function onWaveCleared() {
  if (didWin) return;
  pauseSpawn = true;
  lasers.forEach(l => l.el && l.el.remove()); lasers = [];
  if (waveIdx >= cfg.waves) {
    showWaveClear('ALL CLEAR!');
    setTimeout(win, 700);
    return;
  }
  showWaveClear('WAVE ' + waveIdx + ' CLEAR!');
  setTimeout(() => { if (!didWin) spawnWave(); }, 950);
}

function softInvasion() {
  // SEN: no game over — push formation up + toast
  C.sfxBad();
  C.toast('太近喇！退後再戰', true);
  shake();
  const r = stage.getBoundingClientRect();
  aliens.forEach(a => {
    if (!a.alive) return;
    a.y = Math.max(64, a.y - 48);
    a.el.style.top = a.y + 'px';
  });
  marchDir = 1;
}

function spawnUfo() {
  if (!cfg.ufo || ufo || didWin || pauseSpawn) return;
  const r = stage.getBoundingClientRect();
  const el = document.createElement('div');
  el.className = 'ufo'; el.textContent = '🛸';
  const dir = Math.random() < 0.5 ? 1 : -1;
  const x = dir > 0 ? -40 : r.width + 10;
  el.style.left = x + 'px'; el.style.top = '46px';
  stage.appendChild(el);
  // classic-ish: shot count modulates bonus
  const table = [50, 100, 150, 300];
  const bonus = table[shotsFired % 4];
  ufo = { el, x, y: 46, dir, spd: 2.2 + Math.random(), bonus, alive: true };
}

function hitBunker(L) {
  for (const b of bunkers) {
    if (b.hp <= 0) continue;
    if (L.x >= b.x - 4 && L.x <= b.x + b.w + 4 && L.y >= b.y - 4 && L.y <= b.y + b.h + 8) {
      b.hp -= 1;
      b.el.classList.remove('d2', 'd1', 'dead');
      if (b.hp <= 0) { b.el.classList.add('dead'); C.tone(200, 0.06, 'square', 0.05); }
      else if (b.hp === 2) b.el.classList.add('d2');
      else b.el.classList.add('d1');
      return true;
    }
  }
  return false;
}

function tick() {
  if (didWin) return;
  const r = stage.getBoundingClientRect();
  const defendY = r.height - 70;

  if (cfg.auto && canShoot()) shoot();

  // UFO schedule ~ every 18–26s
  ufoTimer += 1;
  if (ufoTimer > 60 * 20 && Math.random() < 0.01) { ufoTimer = 0; spawnUfo(); }
  if (ufo && ufo.alive) {
    ufo.x += ufo.dir * ufo.spd;
    ufo.el.style.left = ufo.x + 'px';
    if (ufo.x < -60 || ufo.x > r.width + 60) {
      ufo.el.remove(); ufo = null;
    }
  }

  // matrix march
  marchN += 1;
  const period = marchPeriod();
  if (!pauseSpawn && marchN >= period) {
    marchN = 0;
    let hitEdge = false;
    aliens.forEach(a => {
      if (!a.alive) return;
      a.x += marchDir * (10 + (waveIdx * 0.6));
      if (a.x < 8 || a.x > r.width - 36) hitEdge = true;
    });
    if (hitEdge) {
      marchDir *= -1;
      aliens.forEach(a => {
        if (!a.alive) return;
        a.y += cfg.drop;
      });
    }
    beatTone();
  }

  let invaded = false;
  aliens.forEach(a => {
    if (!a.alive) return;
    a.wiggle += 0.07;
    a.el.style.left = a.x + 'px';
    a.el.style.top = (a.y + Math.sin(a.wiggle) * 2.5) + 'px';
    if (a.y + 28 >= defendY) invaded = true;
  });
  if (invaded) softInvasion();

  lasers = lasers.filter(L => {
    L.x += L.dx; L.y += L.dy;
    L.el.style.left = (L.x - 2.5) + 'px'; L.el.style.top = L.y + 'px';
    if (L.y < -30 || L.x < -50 || L.x > r.width + 50) { L.el.remove(); return false; }
    if (L.player && hitBunker(L)) { L.el.remove(); return false; }
    // UFO hit
    if (L.player && ufo && ufo.alive) {
      if (Math.abs((ufo.x + 20) - L.x) < 36 && Math.abs((ufo.y + 16) - L.y) < 28) {
        L.el.remove();
        ufo.alive = false;
        scorePop(ufo.x, ufo.y, 'UFO +' + ufo.bonus);
        C.toast('神秘飛碟！'); C.sfxOk(); shake();
        ufo.el.remove(); ufo = null;
        // bonus does NOT reduce need — pure juice (or +0 progress)
        return false;
      }
    }
    const pad = L.big ? 40 : 34;
    for (const a of aliens) {
      if (!a.alive) continue;
      if (Math.abs((a.x + 18) - L.x) < pad && Math.abs((a.y + 18) - L.y) < 30) {
        L.el.remove(); killAlien(a); return false;
      }
    }
    return true;
  });

  raf = requestAnimationFrame(tick);
}

function win() {
  clearField();
  C.finishClear({
    gid: GID,
    progress: needTotal,
    mode: diffKey,
    label: '太空入侵·' + cfg.label + '·' + needTotal + '殺',
    displayName,
    setDidWin: v => { didWin = v; }
  });
}

function start() {
  clearField();
  applyDiffUI();
  didWin = false; progress = 0; coolUntil = 0; waveIdx = 0;
  streak = 0; lastKill = 0; aim = 0; shotsFired = 0; ufoTimer = 0;
  marchDir = 1; marchN = 0; pauseSpawn = false;
  document.querySelectorAll('.aimbtn').forEach(b => b.classList.toggle('on', +b.dataset.aim === 0));
  ship.style.transform = 'rotate(0deg)';
  C.setProgress(0, needTotal);
  shipX = 0.5; shipWrap.style.left = '50%';
  $('combo').classList.remove('on');
  $('waveClear').classList.remove('on');
  spawnWave();
  raf = requestAnimationFrame(tick);
  if (MouseHubReward && MouseHubReward.autoSpeak()) C.speak(cfg.speak);
}

applyDiffUI();
start();
</script>
</body>
</html>
