<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>過馬路｜將軍澳培智學校</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:"PingFang HK","Noto Sans TC",system-ui,sans-serif;color:#3D2B5A;
background:linear-gradient(180deg,#E3F2FD,#BBDEFB);
-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation;overflow:hidden}
button{font:inherit;border:none;cursor:pointer}
.top{height:60px;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 12px;background:rgba(255,255,255,.92);border-bottom:3px solid #42A5F555}
.who{display:flex;align-items:center;gap:8px;font-weight:900}
.av{width:40px;height:40px;border-radius:50%;border:3px solid #1E88E5;display:grid;place-items:center;font-size:1.3rem;background:#fff}
.hint{flex:1;text-align:center;font-size:clamp(1.05rem,2.3vw,1.45rem);font-weight:900}
.hint b{background:#FFD54F;padding:2px 8px;border-radius:8px}
.icon{width:46px;height:46px;border-radius:14px;background:#fff;border:3px solid rgba(61,43,90,.12);font-size:1.15rem;font-weight:900}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.stage{height:calc(100% - 60px);position:relative;overflow:hidden;display:flex;flex-direction:column;padding:48px 10px 56px}
.meter-wrap{position:absolute;left:12px;right:12px;top:10px;z-index:5;display:flex;align-items:center;gap:10px;pointer-events:none}
.meter{flex:1;height:16px;border-radius:999px;background:rgba(61,43,90,.12);overflow:hidden}
.meter>i{display:block;height:100%;width:0;background:linear-gradient(90deg,#69F0AE,#1E88E5);transition:width .2s}
.m-lab{font-weight:900;letter-spacing:1px;font-size:1.1rem}
.guide{position:absolute;left:12px;bottom:12px;z-index:5;background:rgba(255,255,255,.95);border:3px solid #1E88E5;border-radius:16px;padding:8px 12px;font-weight:900;max-width:85%}
.toast{position:fixed;left:50%;top:14%;transform:translateX(-50%) scale(.92);background:#fff;border:4px solid #22c55e;color:#166534;font-size:1.35rem;font-weight:900;padding:12px 20px;border-radius:999px;opacity:0;pointer-events:none;transition:.2s;z-index:40}
.toast.show{opacity:1;transform:translateX(-50%) scale(1)}.toast.bad{border-color:#FF6B9D;color:#9f1239}
.overlay{position:fixed;inset:0;background:rgba(61,43,90,.45);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.overlay.on{display:flex}
.modal{width:min(440px,94vw);background:#fff;border:5px solid #FFD54F;border-radius:28px;padding:22px 16px;text-align:center}
.modal h2{font-size:1.9rem;margin-bottom:6px}.modal p{font-weight:800;opacity:.8;margin-bottom:12px}
.btn{min-height:54px;min-width:120px;padding:12px 16px;border-radius:999px;background:linear-gradient(135deg,#1E88E5,#66BB6A);color:#fff;font-size:1.15rem;font-weight:900}
.btn.ghost{background:#fff;color:#3D2B5A;border:3px solid rgba(61,43,90,.12)}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:45;overflow:hidden}
.confetti i{position:absolute;top:-16px;width:10px;height:16px;border-radius:3px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.lanes{flex:1;display:flex;flex-direction:column;gap:6px;width:min(640px,96vw);margin:0 auto}
.lane{flex:1;border-radius:14px;position:relative;overflow:hidden;min-height:52px;display:flex;align-items:center}
.lane.safe{background:linear-gradient(90deg,#A5D6A7,#81C784);border:3px solid #2E7D32}
.lane.road{background:linear-gradient(90deg,#546E7A,#455A64);border:3px dashed #CFD8DC}
.lane.goal{background:linear-gradient(90deg,#FFE082,#FFD54F);border:3px solid #F9A825}
.lane .lab{position:absolute;left:8px;top:4px;font-size:.72rem;font-weight:900;opacity:.7;z-index:1;pointer-events:none}
.cell{flex:1;height:100%;display:grid;place-items:center;cursor:pointer;position:relative;z-index:2;background:transparent;border:none;min-width:0}
.cell:hover{background:rgba(255,255,255,.18)}
.cell.here{box-shadow:inset 0 0 0 4px #FFD54F;background:rgba(255,213,79,.25)}
.cell.ok-next{box-shadow:inset 0 0 0 3px #69F0AE}
.frog{font-size:clamp(1.8rem,6vw,2.6rem);line-height:1;pointer-events:none;filter:drop-shadow(0 2px 4px rgba(0,0,0,.25))}
.car{position:absolute;top:50%;transform:translateY(-50%);font-size:clamp(1.6rem,5vw,2.2rem);line-height:1;z-index:3;pointer-events:none;filter:drop-shadow(0 2px 4px rgba(0,0,0,.3))}
</style>
</head>
<body>
<div class="toast" id="toast"></div>
<div class="confetti" id="confetti"></div>
<div class="top">
  <div class="who"><div class="av" id="av">🐱</div><span id="whoName">同學</span></div>
  <div class="hint" id="hint">點前面格 · 青蛙 <b>過馬路</b></div>
  <div class="row">
    <button class="icon" id="btnSpeak" type="button">🔊</button>
    <button class="icon" id="btnHub" type="button">🏠</button>
  </div>
</div>
<div class="stage" id="stage">
  <div class="meter-wrap"><div class="meter"><i id="fill"></i></div><div class="m-lab" id="mlab">0/5</div></div>
  <div class="guide" id="guide">一格一格向前跳，唔好撞車！</div>
  <div class="lanes" id="lanes"></div>
</div>
<div class="overlay" id="win">
  <div class="modal">
    <div style="font-size:2.4rem" id="winMedal">🥇</div>
    <h2>做得好！</h2>
    <p id="winMsg">完成</p>
    <div class="row">
      <button class="btn ghost" id="btnRetry" type="button">再玩</button>
      <button class="btn" id="btnCert" type="button">證書</button>
      <button class="btn" id="btnNext" type="button">下一個</button>
      <button class="btn ghost" id="btnHub2" type="button">主頁</button>
    </div>
  </div>
</div>
<script src="./reward.js"></script>
<script src="./cert.js"></script>
<script src="./common.js"></script>
<script>
const C = MouseHubCommon, NEED = 5, GID = 'frog';
const $ = C.$, lanesEl = $('lanes');
const COLS = 5;
const LAYOUT = [
  { type: 'goal', lab: '🏡 對岸' },
  { type: 'road', lab: '🚗 馬路', dir: 1, speed: 1.1 },
  { type: 'safe', lab: '🟩 安全島' },
  { type: 'road', lab: '🚕 馬路', dir: -1, speed: 1.35 },
  { type: 'safe', lab: '🟩 起步' }
];
let progress = 0, didWin = false, row = 4, col = 2, cars = [], raf = 0, cells = [];
const displayName = C.loadProfile();
C.lockSEN(); C.armAudioOnce();

function build() {
  lanesEl.innerHTML = '';
  cells = [];
  cars.forEach(c => c.el && c.el.remove());
  cars = [];
  LAYOUT.forEach((L, ri) => {
    const lane = document.createElement('div');
    lane.className = 'lane ' + L.type;
    lane.innerHTML = '<span class="lab">' + L.lab + '</span>';
    const rowCells = [];
    for (let ci = 0; ci < COLS; ci++) {
      const btn = document.createElement('button');
      btn.type = 'button'; btn.className = 'cell';
      btn.dataset.r = ri; btn.dataset.c = ci;
      btn.addEventListener('click', e => { e.preventDefault(); tryMove(+btn.dataset.r, +btn.dataset.c); });
      btn.addEventListener('pointerdown', e => { if (e.button === 0) { e.preventDefault(); tryMove(+btn.dataset.r, +btn.dataset.c); } });
      lane.appendChild(btn);
      rowCells.push(btn);
    }
    lanesEl.appendChild(lane);
    cells.push(rowCells);
    if (L.type === 'road') {
      const n = 2;
      for (let i = 0; i < n; i++) {
        const el = document.createElement('div');
        el.className = 'car';
        el.textContent = L.dir > 0 ? '🚗' : '🚕';
        lane.appendChild(el);
        cars.push({ el, lane, dir: L.dir, speed: L.speed * (0.7 + Math.random() * 0.5), x: (i * 45 + Math.random() * 20) % 110 - 10 });
      }
    }
  });
  paint();
}
function paint() {
  cells.forEach((rowC, ri) => rowC.forEach((c, ci) => {
    c.classList.remove('here', 'ok-next');
    c.innerHTML = '';
    if (ri === row && ci === col) {
      c.classList.add('here');
      c.innerHTML = '<span class="frog">🐸</span>';
    } else if (ri === row - 1 && Math.abs(ci - col) <= 1) {
      c.classList.add('ok-next');
    }
  }));
}
function carHit() {
  if (LAYOUT[row].type !== 'road') return false;
  const cell = cells[row][col];
  const cr = cell.getBoundingClientRect();
  const cx = (cr.left + cr.right) / 2, cy = (cr.top + cr.bottom) / 2;
  for (const car of cars) {
    if (car.lane !== cell.parentElement) continue;
    const r = car.el.getBoundingClientRect();
    if (Math.hypot(cx - (r.left + r.width/2), cy - (r.top + r.height/2)) < 36) return true;
  }
  return false;
}
function tryMove(tr, tc) {
  if (didWin || progress >= NEED) return;
  // only forward adjacent (SEN: clear path, no sideways spam needed but allow ±1)
  if (tr !== row - 1 || Math.abs(tc - col) > 1) {
    C.sfxBad(); C.toast('向前跳一格', true); return;
  }
  row = tr; col = tc; paint();
  if (carHit()) {
    C.sfxBad(); C.toast('撞車喇！返起步', true);
    row = 4; col = 2; paint(); return;
  }
  C.sfxOk();
  if (row === 0) {
    C.toast('過到！');
    progress += 1; C.setProgress(progress, NEED);
    if (progress >= NEED) { setTimeout(win, 300); return; }
    row = 4; col = 2; paint();
    C.toast('再過一次 ' + progress + '/' + NEED);
  }
}
function tick() {
  if (didWin) return;
  cars.forEach(car => {
    car.x += car.dir * car.speed * 0.35;
    if (car.dir > 0 && car.x > 110) car.x = -15;
    if (car.dir < 0 && car.x < -15) car.x = 110;
    car.el.style.left = car.x + '%';
  });
  if (carHit()) {
    C.sfxBad(); C.toast('撞車喇！返起步', true);
    row = 4; col = 2; paint();
  }
  raf = requestAnimationFrame(tick);
}
function win() {
  if (raf) cancelAnimationFrame(raf);
  C.finishClear({ gid: GID, progress, label: '過馬路', displayName, setDidWin: v => { didWin = v; } });
}
function start() {
  if (raf) cancelAnimationFrame(raf);
  didWin = false; progress = 0; row = 4; col = 2;
  C.setProgress(0, NEED);
  build();
  if (MouseHubReward && MouseHubReward.autoSpeak()) C.speak('向前跳一格');
  raf = requestAnimationFrame(tick);
}
C.wireChrome({ gid: GID, speakText: '向前跳一格', didWin: () => didWin, onRetry: start });
start();
</script>
</body>
</html>
