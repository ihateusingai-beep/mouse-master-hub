<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>過馬路｜將軍澳培智學校</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:"PingFang HK","Noto Sans TC",system-ui,sans-serif;color:#3D2B5A;
background:linear-gradient(180deg,#81D4FA 0%,#4FC3F7 18%,#66BB6A 18%,#66BB6A 28%,#78909C 28%,#546E7A 78%,#81C784 78%);
-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation;overflow:hidden}
button{font:inherit;border:none;cursor:pointer}
.top{height:60px;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 12px;background:rgba(255,255,255,.94);border-bottom:3px solid #43A047;box-shadow:0 4px 14px rgba(0,0,0,.1)}
.who{display:flex;align-items:center;gap:8px;font-weight:900}
.av{width:40px;height:40px;border-radius:50%;border:3px solid #43A047;display:grid;place-items:center;font-size:1.3rem;background:#E8F5E9}
.hint{flex:1;text-align:center;font-size:clamp(1.05rem,2.3vw,1.45rem);font-weight:900}
.hint b{background:#FFD54F;padding:2px 8px;border-radius:8px}
.icon{width:46px;height:46px;border-radius:14px;background:#fff;border:3px solid rgba(61,43,90,.12);font-size:1.15rem;font-weight:900}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.stage{height:calc(100% - 60px);position:relative;overflow:hidden;display:flex;flex-direction:column;padding:48px 10px 56px}
.meter-wrap{position:absolute;left:12px;right:12px;top:10px;z-index:5;display:flex;align-items:center;gap:10px;pointer-events:none}
.meter{flex:1;height:16px;border-radius:999px;background:rgba(61,43,90,.14);overflow:hidden;border:2px solid rgba(255,255,255,.5)}
.meter>i{display:block;height:100%;width:0;background:linear-gradient(90deg,#69F0AE,#43A047);transition:width .2s}
.m-lab{font-weight:900;letter-spacing:1px;font-size:1.1rem;color:#1B5E20;text-shadow:0 1px 0 #fff}
.guide{position:absolute;left:12px;bottom:12px;z-index:5;background:rgba(255,255,255,.96);border:3px solid #43A047;border-radius:16px;padding:8px 12px;font-weight:900;max-width:88%;box-shadow:0 6px 16px rgba(0,0,0,.1)}
.toast{position:fixed;left:50%;top:14%;transform:translateX(-50%) scale(.92);background:#fff;border:4px solid #22c55e;color:#166534;font-size:1.35rem;font-weight:900;padding:12px 20px;border-radius:999px;opacity:0;pointer-events:none;transition:.2s;z-index:40}
.toast.show{opacity:1;transform:translateX(-50%) scale(1)}.toast.bad{border-color:#FF6B9D;color:#9f1239}
.overlay{position:fixed;inset:0;background:rgba(61,43,90,.45);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.overlay.on{display:flex}
.modal{width:min(440px,94vw);background:#fff;border:5px solid #FFD54F;border-radius:28px;padding:22px 16px;text-align:center}
.modal h2{font-size:1.9rem;margin-bottom:6px}.modal p{font-weight:800;opacity:.8;margin-bottom:12px}
.btn{min-height:54px;min-width:120px;padding:12px 16px;border-radius:999px;background:linear-gradient(135deg,#43A047,#FFD54F);color:#fff;font-size:1.15rem;font-weight:900}
.btn.ghost{background:#fff;color:#3D2B5A;border:3px solid rgba(61,43,90,.12)}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:45;overflow:hidden}
.confetti i{position:absolute;top:-16px;width:10px;height:16px;border-radius:3px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.lanes{flex:1;display:flex;flex-direction:column;gap:8px;width:min(680px,96vw);margin:0 auto}
.lane{flex:1;border-radius:16px;position:relative;overflow:hidden;min-height:56px;display:flex;align-items:center;box-shadow:0 4px 0 rgba(0,0,0,.12)}
.lane.safe{background:linear-gradient(180deg,#A5D6A7,#66BB6A);border:3px solid #2E7D32}
.lane.road{background:
linear-gradient(90deg,transparent 48%,#FFEE58 48% 52%,transparent 52%),
linear-gradient(180deg,#607D8B,#455A64);background-size:40px 100%,100% 100%;border:3px solid #37474F}
.lane.goal{background:linear-gradient(180deg,#FFE082,#FFCA28);border:3px solid #F9A825;
box-shadow:inset 0 0 0 4px rgba(255,255,255,.35),0 0 20px #FFD54F66}
.lane .lab{position:absolute;left:10px;top:6px;font-size:.75rem;font-weight:900;opacity:.75;z-index:1;pointer-events:none;text-shadow:0 1px 0 rgba(255,255,255,.4)}
.cell{flex:1;height:100%;display:grid;place-items:center;cursor:pointer;position:relative;z-index:2;background:transparent;border:none;min-width:0;transition:background .12s,transform .12s}
.cell:active{transform:scale(.96)}
.cell.here{background:rgba(255,213,79,.4);box-shadow:inset 0 0 0 4px #FFD54F}
.cell.ok-next{background:rgba(105,240,174,.35);box-shadow:inset 0 0 0 3px #69F0AE;animation:pulse 1s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:inset 0 0 0 3px #69F0AE}50%{box-shadow:inset 0 0 0 5px #00E676,0 0 12px #69F0AE88}}
.frog{font-size:clamp(1.9rem,6.5vw,2.8rem);line-height:1;pointer-events:none;filter:drop-shadow(0 3px 4px rgba(0,0,0,.3));display:inline-block;transition:transform .12s}
.frog.hop{animation:hop .22s ease}
@keyframes hop{0%{transform:translateY(0) scale(1)}40%{transform:translateY(-18px) scale(1.15)}100%{transform:translateY(0) scale(1)}}
.car{position:absolute;top:50%;transform:translateY(-50%);font-size:clamp(1.7rem,5.5vw,2.4rem);line-height:1;z-index:3;pointer-events:none;filter:drop-shadow(0 3px 5px rgba(0,0,0,.35))}
.house{position:absolute;right:12px;top:50%;transform:translateY(-50%);font-size:1.8rem;opacity:.85;pointer-events:none;z-index:1}
</style>
</head>
<body>
<div class="toast" id="toast"></div>
<div class="confetti" id="confetti"></div>
<div class="top">
  <div class="who"><div class="av" id="av">🐱</div><span id="whoName">同學</span></div>
  <div class="hint" id="hint">點綠色格 · 青蛙 <b>過馬路</b></div>
  <div class="row">
    <button class="icon" id="btnSpeak" type="button">🔊</button>
    <button class="icon" id="btnHub" type="button">🏠</button>
  </div>
</div>
<div class="stage" id="stage">
  <div class="meter-wrap"><div class="meter"><i id="fill"></i></div><div class="m-lab" id="mlab">0/5</div></div>
  <div class="guide" id="guide">綠閃格可跳 · 一格一格向前 · 避車</div>
  <div class="lanes" id="lanes"></div>
</div>
<div class="overlay" id="win">
  <div class="modal">
    <div style="font-size:2.4rem" id="winMedal">🥇</div>
    <h2>做得好！</h2>
    <p id="winMsg">完成</p>
    <div class="row">
      <button class="btn ghost" id="btnRetry" type="button">再玩</button>
      <button class="btn" id="btnCert" type="button">證書</button>
      <button class="btn" id="btnNext" type="button">下一個</button>
      <button class="btn ghost" id="btnHub2" type="button">主頁</button>
    </div>
  </div>
</div>
<script src="./reward.js"></script>
<script src="./cert.js"></script>
<script src="./common.js"></script>
<script>
const C = MouseHubCommon, NEED = 5, GID = 'frog';
const $ = C.$, lanesEl = $('lanes');
const COLS = 5;
const CARS = ['🚗','🚕','🚙','🚌','🛻','🚓'];
const LAYOUT = [
  { type: 'goal', lab: '🏡 屋企' },
  { type: 'road', lab: '馬路', dir: 1, speed: 1.05 },
  { type: 'safe', lab: '🟩 安全島' },
  { type: 'road', lab: '馬路', dir: -1, speed: 1.3 },
  { type: 'safe', lab: '🟩 起步' }
];
let progress = 0, didWin = false, row = 4, col = 2, cars = [], raf = 0, cells = [];
const displayName = C.loadProfile();
C.lockSEN(); C.armAudioOnce();

function build() {
  lanesEl.innerHTML = ''; cells = [];
  cars.forEach(c => c.el && c.el.remove()); cars = [];
  LAYOUT.forEach((L, ri) => {
    const lane = document.createElement('div');
    lane.className = 'lane ' + L.type;
    lane.innerHTML = '<span class="lab">' + L.lab + '</span>';
    if (L.type === 'goal') {
      const h = document.createElement('div'); h.className = 'house'; h.textContent = '🏠'; lane.appendChild(h);
    }
    const rowCells = [];
    for (let ci = 0; ci < COLS; ci++) {
      const btn = document.createElement('button');
      btn.type = 'button'; btn.className = 'cell';
      btn.dataset.r = ri; btn.dataset.c = ci;
      btn.addEventListener('click', e => { e.preventDefault(); tryMove(+btn.dataset.r, +btn.dataset.c); });
      btn.addEventListener('pointerdown', e => { if (e.button === 0) { e.preventDefault(); tryMove(+btn.dataset.r, +btn.dataset.c); } });
      lane.appendChild(btn); rowCells.push(btn);
    }
    lanesEl.appendChild(lane); cells.push(rowCells);
    if (L.type === 'road') {
      const n = 2 + (progress > 2 ? 1 : 0);
      const spd = L.speed * (1 + progress * 0.08);
      for (let i = 0; i < n; i++) {
        const el = document.createElement('div'); el.className = 'car';
        el.textContent = CARS[(ri + i + progress) % CARS.length];
        lane.appendChild(el);
        cars.push({ el, lane, dir: L.dir, speed: spd * (0.75 + Math.random() * 0.45), x: (i * (100 / n) + Math.random() * 12) % 110 - 8 });
      }
    }
  });
  paint();
}
function paint() {
  cells.forEach((rowC, ri) => rowC.forEach((c, ci) => {
    c.classList.remove('here', 'ok-next');
    c.innerHTML = '';
    if (ri === row && ci === col) {
      c.classList.add('here');
      c.innerHTML = '<span class="frog" id="frogFace">🐸</span>';
    } else if (ri === row - 1 && Math.abs(ci - col) <= 1) {
      c.classList.add('ok-next');
    }
  }));
}
function hopAnim() {
  const f = document.getElementById('frogFace');
  if (!f) return;
  f.classList.remove('hop'); void f.offsetWidth; f.classList.add('hop');
}
function carHit() {
  if (LAYOUT[row].type !== 'road') return false;
  const cell = cells[row][col];
  const cr = cell.getBoundingClientRect();
  const cx = (cr.left + cr.right) / 2, cy = (cr.top + cr.bottom) / 2;
  for (const car of cars) {
    if (car.lane !== cell.parentElement) continue;
    const r = car.el.getBoundingClientRect();
    if (Math.hypot(cx - (r.left + r.width / 2), cy - (r.top + r.height / 2)) < 38) return true;
  }
  return false;
}
function tryMove(tr, tc) {
  if (didWin || progress >= NEED) return;
  if (tr !== row - 1 || Math.abs(tc - col) > 1) {
    C.sfxBad(); C.toast('跳前面綠格', true); return;
  }
  row = tr; col = tc; paint(); hopAnim();
  C.tone(480, 0.06, 'triangle', 0.1);
  if (carHit()) {
    C.sfxBad(); C.toast('撞車！返起步', true);
    row = 4; col = 2; paint(); return;
  }
  if (row === 0) {
    C.sfxOk(); C.toast('到屋企！');
    progress += 1; C.setProgress(progress, NEED);
    if (progress >= NEED) { setTimeout(win, 300); return; }
    row = 4; col = 2; build();
  } else C.sfxOk();
}
function tick() {
  if (didWin) return;
  cars.forEach(car => {
    car.x += car.dir * car.speed * 0.38;
    if (car.dir > 0 && car.x > 112) car.x = -16;
    if (car.dir < 0 && car.x < -16) car.x = 112;
    car.el.style.left = car.x + '%';
  });
  if (carHit()) {
    C.sfxBad(); C.toast('撞車！返起步', true);
    row = 4; col = 2; paint();
  }
  raf = requestAnimationFrame(tick);
}
function win() {
  if (raf) cancelAnimationFrame(raf);
  C.finishClear({ gid: GID, progress, label: '過馬路', displayName, setDidWin: v => { didWin = v; } });
}
function start() {
  if (raf) cancelAnimationFrame(raf);
  didWin = false; progress = 0; row = 4; col = 2;
  C.setProgress(0, NEED); build();
  if (MouseHubReward && MouseHubReward.autoSpeak()) C.speak('跳前面綠格');
  raf = requestAnimationFrame(tick);
}
C.wireChrome({ gid: GID, speakText: '跳前面綠格', didWin: () => didWin, onRetry: start });
start();
</script>
</body>
</html>
