<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>氣球派對</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:"PingFang HK","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;color:#3D2B5A;
background:linear-gradient(180deg,#FFE0F0,#E3F2FD 50%,#FFF9C4);
-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation;overflow:hidden}
button{font:inherit;border:none;cursor:pointer}
.top{height:64px;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 12px;background:rgba(255,255,255,.92);border-bottom:3px solid rgba(255,107,157,.25)}
.who{display:flex;align-items:center;gap:8px;font-weight:900;font-size:1.1rem}
.who .av{width:42px;height:42px;border-radius:50%;border:3px solid #FF6B9D;background:#fff;display:grid;place-items:center;font-size:1.4rem}
.hint{flex:1;text-align:center;font-size:clamp(1.1rem,2.4vw,1.55rem);font-weight:900}
.hint b{background:#FFD54F;padding:2px 8px;border-radius:8px}
.combo{position:absolute;left:50%;top:70px;transform:translateX(-50%);font-size:1.6rem;font-weight:900;color:#FF6B9D;opacity:0;transition:.2s;z-index:6;text-shadow:0 2px 0 #fff}
.combo.on{opacity:1;transform:translateX(-50%) scale(1.15)}
.icon{width:48px;height:48px;border-radius:14px;background:#fff;border:3px solid rgba(61,43,90,.12);font-size:1.25rem;font-weight:900}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.stage{height:calc(100% - 64px);position:relative;overflow:hidden}
.meter-wrap{position:absolute;left:12px;right:12px;top:10px;z-index:5;display:flex;align-items:center;gap:10px}
.meter{flex:1;height:16px;border-radius:999px;background:rgba(61,43,90,.12);overflow:hidden}
.meter>i{display:block;height:100%;width:0;background:linear-gradient(90deg,#69F0AE,#FF6B9D);transition:width .2s}
.m-lab{font-weight:900;min-width:5rem;letter-spacing:2px;font-size:1.15rem}
.guide{position:absolute;left:12px;bottom:12px;z-index:5;background:rgba(255,255,255,.95);border:3px solid #FFD54F;border-radius:16px;padding:8px 12px;font-weight:900}
.toast{position:fixed;left:50%;top:16%;transform:translateX(-50%) scale(.92);background:#fff;border:4px solid #22c55e;color:#166534;font-size:1.35rem;font-weight:900;padding:12px 22px;border-radius:999px;opacity:0;pointer-events:none;transition:.2s;z-index:40}
.toast.show{opacity:1;transform:translateX(-50%) scale(1)}
.overlay{position:fixed;inset:0;background:rgba(61,43,90,.45);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.overlay.on{display:flex}
.modal{width:min(440px,94vw);background:#fff;border:5px solid #FFD54F;border-radius:28px;padding:24px 18px;text-align:center}
.modal h2{font-size:2rem;margin-bottom:6px}
.modal p{font-weight:800;opacity:.8;margin-bottom:14px}
.btn{min-height:56px;min-width:140px;padding:12px 20px;border-radius:999px;background:linear-gradient(135deg,#FF6B9D,#FF9D7A);color:#fff;font-size:1.2rem;font-weight:900}
.btn.ghost{background:#fff;color:#3D2B5A;border:3px solid rgba(61,43,90,.12)}
.balloon{position:absolute;width:100px;height:120px;display:grid;place-items:center;font-size:3.2rem;cursor:pointer;z-index:3;border:none;background:transparent;filter:drop-shadow(0 8px 12px rgba(0,0,0,.15));animation:floaty 2.2s ease-in-out infinite}
.balloon.rainbow{animation:floaty .6s ease-in-out infinite, glow .4s ease-in-out infinite alternate}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes glow{from{filter:drop-shadow(0 0 8px #FFD54F)}to{filter:drop-shadow(0 0 18px #FF6B9D)}}
.pop{animation:pop .28s ease forwards}
@keyframes pop{to{transform:scale(1.6);opacity:0}}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:45;overflow:hidden}
.confetti i{position:absolute;top:-16px;width:10px;height:16px;border-radius:3px;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
</style>
</head>
<body>
<div class="toast" id="toast"></div>
<div class="confetti" id="confetti"></div>
<div class="combo" id="combo">連撃 ×2 🌈</div>
<div class="top">
  <div class="who"><div class="av" id="av">🐱</div><span id="whoName">同學</span></div>
  <div class="hint">撳 <b>氣球</b> · 連撃有彩帶</div>
  <div class="row">
    <button class="icon" id="btnSpeak" type="button">🔊</button>
    <button class="icon" id="btnHub" type="button">🏠</button>
  </div>
</div>
<div class="stage" id="stage">
  <div class="meter-wrap"><div class="meter"><i id="fill"></i></div><div class="m-lab" id="mlab">🦴🦴🦴🦴🦴🦴🦴🦴</div></div>
  <div class="guide">左掣撳氣球 · 快快連撳有彩虹</div>
</div>
<div class="overlay" id="win">
  <div class="modal">
    <div style="font-size:2.4rem">🎈🎉🎈</div>
    <h2>派對成功！</h2>
    <p id="winMsg">完成喇</p>
    <div class="row">
      <button class="btn ghost" id="btnRetry" type="button">再玩</button>
      <button class="btn" id="btnHub2" type="button">主頁</button>
    </div>
  </div>
</div>
<script src="./reward.js"></script>
<script>
document.addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('selectstart',e=>e.preventDefault());
const NEED=8, HUB='./index.html';
const BALLOONS=['🔴','🟠','🟡','🟢','🔵','🟣','🩷','🎈'];
const $=id=>document.getElementById(id);
const stage=$('stage');
let progress=0, combo=0, lastPop=0, audioCtx=null;
function loadProfile(){
  let who=null,name='';
  try{
    const p=new URLSearchParams(location.search);
    name=(p.get('name')||localStorage.getItem('mouse_hub_name')||'').trim();
    who=JSON.parse(localStorage.getItem('mouse_hub_who')||'null');
  }catch(_){}
  if(!who) who={emoji:'🐱',name:'同學'};
  $('av').textContent=who.emoji||'🐱';
  $('whoName').textContent=name||who.name||'同學';
  return name||who.name||'同學';
}
const displayName=loadProfile();
function ctx(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();return audioCtx}
function tone(f,d=.12,t='sine',v=.2){try{const c=ctx(),o=c.createOscillator(),g=c.createGain();o.type=t;o.frequency.value=f;g.gain.setValueAtTime(v,c.currentTime);g.gain.exponentialRampToValueAtTime(.01,c.currentTime+d);o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+d)}catch(_){}}
function sfxOk(){tone(523+combo*40,.1);setTimeout(()=>tone(659+combo*30,.1),60)}
function sfxWin(){[523,659,784,1046].forEach((f,i)=>setTimeout(()=>tone(f,.16,'triangle',.2),i*80))}
function sfxRainbow(){[523,659,784,988,1175].forEach((f,i)=>setTimeout(()=>tone(f,.1,'square',.12),i*50))}
function speak(t){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='zh-HK';u.rate=.92;speechSynthesis.speak(u)}catch(_){}}
function toast(m){const el=$('toast');el.textContent=m;el.classList.add('show');clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove('show'),1000)}
function confetti(){const box=$('confetti');box.innerHTML='';const cols=['#FF6B9D','#FFD54F','#69F0AE','#4FC3F7','#B388FF'];for(let i=0;i<36;i++){const el=document.createElement('i');el.style.left=Math.random()*100+'vw';el.style.background=cols[i%cols.length];el.style.animationDuration=(1+Math.random()*1.4)+'s';box.appendChild(el)}setTimeout(()=>box.innerHTML='',2600)}
function setProgress(n){progress=n;$('fill').style.width=Math.min(100,n/NEED*100)+'%';$('mlab').textContent=(window.MouseHubReward&&MouseHubReward.fishBones)?MouseHubReward.fishBones(n,NEED):(n+'/'+NEED)}
function showCombo(n){const el=$('combo');el.textContent=n>=3?'連撃 ×'+n+' 🌈🌈':'連撃 ×'+n+' 🌈';el.classList.add('on');clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove('on'),700)}
function bigCelebrate(done){
  const ov=document.createElement('div');
  ov.style.cssText='position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;background:rgba(61,43,90,.55)';
  ov.innerHTML='<div style="font-size:clamp(2rem,8vw,3.5rem);font-weight:900;color:#fff;text-align:center;text-shadow:0 4px 16px rgba(0,0,0,.35)">🎈 派對成功！<br>😻</div>';
  document.body.appendChild(ov);
  setTimeout(()=>{ov.remove();done&&done()},2000);
}
function win(){
  try{if(window.MouseHubReward){const a=MouseHubReward.award('balloons');if(a&&a.stickerNew)toast('貼紙 +'+a.sticker.emoji)}}catch(_){}
  confetti();sfxWin();speak('做得好');
  bigCelebrate(()=>{$('winMsg').textContent=displayName+' · 氣球派對';$('win').classList.add('on')});
}
function rand(a,b){return a+Math.random()*(b-a)}
function spawn(){
  stage.querySelectorAll('.balloon').forEach(el=>el.remove());
  if(progress>=NEED) return;
  // spawn 1-2 balloons; combo target glows after first pop soon
  const count = combo>=2 ? 2 : 1;
  for(let i=0;i<count;i++){
    const el=document.createElement('button');
    el.type='button'; el.className='balloon'+(combo>=2?' rainbow':'');
    el.textContent=BALLOONS[(progress+i)%BALLOONS.length];
    el.style.left=rand(10,75)+'%';
    el.style.top=rand(22,62)+'%';
    el.onclick=e=>{
      if(e.button!=null&&e.button!==0) return;
      el.classList.add('pop');
      const now=Date.now();
      if(now-lastPop<1600) combo++; else combo=1;
      lastPop=now;
      if(combo>=2){showCombo(combo); if(combo>=3) sfxRainbow(); else sfxOk();}
      else sfxOk();
      toast(combo>=3?'彩虹爆！':'好！');
      setTimeout(()=>el.remove(),250);
      setProgress(progress+1);
      if(progress>=NEED) setTimeout(win,320);
      else setTimeout(spawn, combo>=2?180:280);
    };
    stage.appendChild(el);
  }
}
function start(){progress=0;combo=0;lastPop=0;setProgress(0);spawn();speak('撳氣球')}
$('btnHub').onclick=$('btnHub2').onclick=()=>location.href=HUB;
$('btnSpeak').onclick=()=>speak('撳氣球');
$('btnRetry').onclick=()=>{$('win').classList.remove('on');start()};
window.addEventListener('pointerdown',()=>{try{ctx()}catch(_){}},{once:true});
start();
</script>
</body>
</html>
