<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>滑鼠小達人｜將軍澳培智學校</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  height: 100%;
  font-family: "PingFang HK", "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif;
  background: linear-gradient(165deg, #E8F4FF 0%, #FFE4F1 45%, #FFF3C4 100%);
  color: #3D2B5A;
  -webkit-user-select: none; user-select: none;
  -webkit-touch-callout: none; touch-action: manipulation;
  overflow: hidden;
}
button, input { font: inherit; border: none; cursor: pointer; }
body { display: flex; flex-direction: column; min-height: 100%; overflow-y: auto; -webkit-overflow-scrolling: touch; }
.top { flex-shrink: 0; padding: 12px 16px 4px; text-align: center; }
.brand {
  display: flex; align-items: center; justify-content: center; gap: 12px;
  margin: 0 auto; width: min(520px, 94vw); text-align: left;
}
.school-logo {
  width: clamp(56px, 14vw, 72px); height: clamp(56px, 14vw, 72px);
  object-fit: contain; flex-shrink: 0; border-radius: 12px;
  background: #fff; box-shadow: 0 4px 12px rgba(61,43,90,.1);
}
.brand-text { min-width: 0; flex: 1; }
.school { font-size: clamp(.95rem, 2.8vw, 1.15rem); font-weight: 900; color: #426eb4; line-height: 1.2; }
.logo { font-size: clamp(1.45rem, 4.2vw, 2.2rem); font-weight: 900; line-height: 1.15; margin-top: 2px; }
.sub { margin-top: 6px; font-weight: 800; opacity: .65; font-size: .95rem; }
.pet-card {
  margin: 10px auto 0; width: min(520px, 94vw);
  background: #fff; border: 4px solid #FF6B9D; border-radius: 22px;
  padding: 10px 12px; display: flex; align-items: center; gap: 12px;
  box-shadow: 0 8px 24px rgba(61,43,90,.1); text-align: left;
}
.pet-card.jump .pet-emoji { animation: jump .7s ease; }
@keyframes jump {
  0%,100% { transform: translateY(0) scale(1); }
  30% { transform: translateY(-18px) scale(1.15); }
  55% { transform: translateY(0) scale(.95); }
  75% { transform: translateY(-8px) scale(1.05); }
}
.pet-emoji { font-size: 3rem; line-height: 1; min-width: 64px; text-align: center; }
.pet-info { flex: 1; min-width: 0; }
.pet-name { font-weight: 900; font-size: 1.15rem; }
.pet-lv { font-weight: 800; opacity: .75; font-size: .92rem; margin-top: 2px; }
.pet-bar { margin-top: 6px; height: 12px; border-radius: 999px; background: rgba(61,43,90,.1); overflow: hidden; }
.pet-bar > i { display: block; height: 100%; width: 0%; background: linear-gradient(90deg, #69F0AE, #FFD54F); transition: width .35s; }
.who-bar {
  margin: 10px auto 0; width: min(520px, 94vw);
  display: flex; flex-wrap: wrap; gap: 6px; align-items: center; justify-content: center;
}
.id-mini { display: flex; gap: 5px; flex-wrap: wrap; justify-content: center; }
.id-chip {
  width: 44px; height: 44px; border-radius: 12px;
  border: 3px solid rgba(255,107,157,.3); background: #fff;
  font-size: 1.35rem; display: grid; place-items: center;
}
.id-chip.sel { border-color: #22c55e; box-shadow: 0 0 0 3px rgba(34,197,94,.25); }
.name-wrap { flex: 1 1 140px; max-width: 200px; }
.name-wrap input {
  width: 100%; min-height: 44px; border-radius: 12px;
  border: 3px solid rgba(255,107,157,.3); padding: 6px 10px;
  font-weight: 800; text-align: center; background: #fff; color: #3D2B5A; outline: none;
  -webkit-user-select: text; user-select: text;
}
.hint-mini { width: 100%; text-align: center; font-size: .8rem; font-weight: 700; opacity: .5; }
.main { flex: 1; padding: 8px 14px 22px; width: min(960px, 100%); margin: 0 auto; }
.sec-title { font-weight: 900; font-size: 1.05rem; margin: 10px 0 8px; }
.stickers {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(64px, 1fr)); gap: 6px; margin-bottom: 8px;
}
.sticker {
  aspect-ratio: 1; border-radius: 14px; border: 3px dashed #ddd; background: #f3f3f6;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 1px; font-weight: 900; opacity: .4; filter: grayscale(1); transition: .25s;
}
.sticker.on {
  opacity: 1; filter: none; border-style: solid; border-color: #FFD54F;
  background: #FFFBEB; box-shadow: 0 0 0 3px rgba(255,213,79,.3);
}
.sticker.fly { animation: flyin .7s ease; }
@keyframes flyin {
  0% { transform: scale(2) translateY(-30px); opacity: 0; }
  100% { transform: scale(1) translateY(0); opacity: 1; }
}
.sticker .em { font-size: 1.35rem; line-height: 1; }
.sticker .lb { font-size: .55rem; }
.grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px;
}
.card {
  min-height: 148px; border-radius: 18px; border: 3px solid rgba(255,107,157,.28);
  background: #fff; padding: 12px 8px; display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 4px; text-align: center;
  position: relative; cursor: pointer; box-shadow: 0 6px 16px rgba(61,43,90,.08);
}
.card:hover { transform: translateY(-2px); }
.card:active { transform: scale(.98); }
.card .emoji { font-size: 2.2rem; line-height: 1; }
.card .title { font-size: 1rem; font-weight: 900; }
.card .tag { font-size: .78rem; font-weight: 800; padding: 2px 8px; border-radius: 999px; background: #FFE4F1; color: #C2185B; }
.card .medal { position: absolute; top: 6px; left: 6px; font-size: 1.15rem; }
.card .cert-btn {
  position: absolute; top: 6px; right: 6px;
  font-size: .7rem; font-weight: 900; padding: 3px 7px; border-radius: 999px;
  background: #FFF8E1; border: 2px solid #F5B700; color: #8D6E00;
}
.card .cert-btn:disabled { opacity: .35; border-color: #ccc; color: #999; background: #f5f5f5; }
.foot { text-align: center; padding: 4px 16px 16px; font-weight: 700; opacity: .45; font-size: .8rem; }
.teacher { position: fixed; right: 8px; bottom: 8px; z-index: 20; }
.teacher details {
  background: rgba(255,255,255,.96); border: 3px solid rgba(61,43,90,.12);
  border-radius: 12px; padding: 8px 10px; font-size: .85rem; font-weight: 700; min-width: 170px;
}
.teacher summary { cursor: pointer; list-style: none; }
.teacher label { display: flex; gap: 6px; align-items: center; margin-top: 8px; }
.won-ov {
  position: fixed; inset: 0; z-index: 50;
  background: rgba(61,43,90,.5);
  display: none; align-items: center; justify-content: center; padding: 16px;
}
.won-ov.on { display: flex; }
.won-box {
  width: min(400px, 94vw); background: #fff; border-radius: 28px;
  border: 5px solid #FFD54F; padding: 22px 16px; text-align: center;
}
.won-box .big { font-size: 3.5rem; line-height: 1; margin-bottom: 6px; }
.won-box h2 { font-size: 1.7rem; margin-bottom: 6px; }
.won-box p { font-weight: 800; opacity: .8; margin-bottom: 14px; }
.won-box .btn {
  min-height: 52px; min-width: 120px; padding: 10px 18px; border-radius: 999px;
  background: linear-gradient(135deg, #FF6B9D, #FF9D7A); color: #fff; font-weight: 900; font-size: 1.1rem; margin: 4px;
}
.won-box .btn.ghost { background: #fff; color: #3D2B5A; border: 3px solid rgba(61,43,90,.12); }
@media (max-width: 520px) {
  .grid { grid-template-columns: 1fr 1fr; }
}
</style>
</head>
<body>
<header class="top">
  <div class="brand">
    <img class="school-logo" src="https://www.puichi.edu.hk/it-school/php/webcms/files/upload/tinymce//1a__pui_chi_logo_png_1791177564.png" alt="將軍澳培智學校校徽" width="72" height="72" decoding="async">
    <div class="brand-text">
      <div class="school">將軍澳培智學校</div>
      <div class="logo">🖱️ 滑鼠小達人</div>
    </div>
  </div>
  <div class="sub">自由揀關 · 每關有證書</div>
  <div class="pet-card" id="petCard">
    <div class="pet-emoji" id="petEmoji">🐱</div>
    <div class="pet-info">
      <div class="pet-name" id="petName">我嘅小貓</div>
      <div class="pet-lv" id="petLv">再玩就進化！</div>
      <div class="pet-bar"><i id="petFill"></i></div>
    </div>
  </div>
  <div class="who-bar">
    <div class="id-mini" id="idMini"></div>
    <div class="name-wrap">
      <input id="studentName" type="text" maxlength="12" autocomplete="off" spellcheck="false" placeholder="名字（可留空）" value="">
    </div>
    <div class="hint-mini">唔填名都可以玩</div>
  </div>
</header>

<main class="main">
  <div class="sec-title">📒 貼紙冊</div>
  <div class="stickers" id="stickerWall"></div>

  <div class="sec-title">🌱 基礎關（自由揀）</div>
  <div class="grid" id="gridBasic"></div>

  <div class="sec-title">🎮 練習關（自由揀）</div>
  <div class="grid" id="gridSkill"></div>
</main>

<footer class="foot">將軍澳培智學校 · 電腦科 · 小一／小二 · 每關完成可攞證書</footer>

<div class="won-ov" id="wonOv">
  <div class="won-box">
    <div class="big" id="wonBig">😻</div>
    <h2 id="wonTitle">太叻喇！</h2>
    <p id="wonMsg">小貓好開心！</p>
    <button class="btn" type="button" id="wonCert">看證書</button>
    <button class="btn ghost" type="button" id="wonOk">繼續</button>
  </div>
</div>

<div class="teacher">
  <details>
    <summary>老師角</summary>
    <label><input type="checkbox" id="chkAutoSpeak"> 入遊戲自動讀</label>
    <p style="margin-top:8px;opacity:.7;line-height:1.35">自由選關。金≥20下／移5；銀≥12／移3；其餘銅。</p>
  </details>
</div>

<script src="./reward.js"></script>
<script src="./cert.js"></script>
<script>
(() => {
  document.addEventListener('contextmenu', e => e.preventDefault());
  document.addEventListener('selectstart', e => {
    if (e.target && e.target.closest && e.target.closest('input, textarea')) return;
    e.preventDefault();
  });

  const R = window.MouseHubReward;
  const LS_NAME = 'mouse_hub_name';
  const LS_WHO = 'mouse_hub_who';
  const LS_FEED_NAME = 'mouse_feeder_student_name';
  const LS_FEED_WHO = 'mouse_feeder_who';
  let lastWon = null;

  const IDS = [
    { id: 'cat', emoji: '🐱', name: '小貓' },
    { id: 'dog', emoji: '🐶', name: '小狗' },
    { id: 'bear', emoji: '🐻', name: '小熊' },
    { id: 'rabbit', emoji: '🐰', name: '小兔' },
    { id: 'panda', emoji: '🐼', name: '熊貓' },
    { id: 'fox', emoji: '🦊', name: '小狐' },
    { id: 'chick', emoji: '🐥', name: '小雞' },
    { id: 'star', emoji: '⭐', name: '星星' },
  ];

  let who = null;
  try { who = JSON.parse(localStorage.getItem(LS_WHO) || 'null'); } catch (_) {}
  const nameInput = document.getElementById('studentName');
  nameInput.value = localStorage.getItem(LS_NAME) || '';

  function saveProfile() {
    const name = (nameInput.value || '').trim();
    localStorage.setItem(LS_NAME, name);
    localStorage.setItem(LS_FEED_NAME, name);
    if (who) {
      localStorage.setItem(LS_WHO, JSON.stringify(who));
      localStorage.setItem(LS_FEED_WHO, JSON.stringify(who));
    }
  }

  function speak(t) {
    try {
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(t);
      u.lang = 'zh-HK'; u.rate = 0.92;
      speechSynthesis.speak(u);
    } catch (_) {}
  }

  function renderPet() {
    const pet = R.loadPet();
    const st = R.stageFor(pet.level);
    const xp = R.xpToNext(pet);
    document.getElementById('petEmoji').textContent = st.emoji;
    document.getElementById('petName').textContent = '我嘅' + st.label;
    if (pet.level >= 10) {
      document.getElementById('petLv').textContent = 'Lv.10 滿等！';
      document.getElementById('petFill').style.width = '100%';
    } else {
      document.getElementById('petLv').textContent = `Lv.${pet.level} · 再玩 ${xp.left} 次就進化！`;
      document.getElementById('petFill').style.width = ((xp.into / xp.need) * 100) + '%';
    }
  }

  function renderStickers(flyId) {
    const got = R.loadStickers();
    const wall = document.getElementById('stickerWall');
    wall.innerHTML = '';
    Object.keys(R.STICKER_META).forEach(id => {
      const m = R.STICKER_META[id];
      const el = document.createElement('div');
      el.className = 'sticker' + (got[id] ? ' on' : '') + (flyId === id ? ' fly' : '');
      el.innerHTML = `<span class="em">${got[id] ? m.emoji : '❓'}</span><span class="lb">${m.name}</span>`;
      wall.appendChild(el);
    });
  }

  function renderIds() {
    const box = document.getElementById('idMini');
    box.innerHTML = '';
    IDS.forEach(p => {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'id-chip' + (who?.id === p.id ? ' sel' : '');
      b.textContent = p.emoji;
      b.setAttribute('aria-label', p.name);
      b.onclick = () => { who = p; saveProfile(); renderIds(); };
      box.appendChild(b);
    });
  }

  function openGame(g) {
    saveProfile();
    location.href = R.gameUrl(g);
  }

  function renderGames() {
    const certs = R.loadCerts();
    ['basic', 'skill'].forEach(group => {
      const grid = document.getElementById(group === 'basic' ? 'gridBasic' : 'gridSkill');
      grid.innerHTML = '';
      R.GAMES.filter(g => g.group === group).forEach(g => {
        const c = certs[g.id];
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML =
          (c ? `<span class="medal">${R.TIER_META[c.tier].medal}</span>` : '') +
          `<button type="button" class="cert-btn" data-id="${g.id}" ${c ? '' : 'disabled'}>證書</button>` +
          `<span class="emoji">${g.emoji}</span>` +
          `<span class="title">${g.title}</span>` +
          `<span class="tag">${g.tag}</span>`;
        card.addEventListener('click', e => {
          if (e.target.closest('.cert-btn')) {
            e.stopPropagation();
            if (c) MouseHubCert.showCert(g.id);
            return;
          }
          openGame(g);
        });
        grid.appendChild(card);
      });
    });
  }

  function showWon(gameId) {
    lastWon = gameId;
    const meta = R.STICKER_META[gameId] || { emoji: '⭐' };
    const st = R.stageFor(R.loadPet().level);
    const certs = R.loadCerts();
    const c = certs[gameId];
    const medal = c ? R.TIER_META[c.tier].medal : '⭐';
    document.getElementById('wonBig').textContent = st.emoji;
    document.getElementById('wonTitle').textContent = '太叻喇！';
    document.getElementById('wonMsg').textContent = `${st.label}好開心！${meta.emoji} ${medal}`;
    document.getElementById('wonOv').classList.add('on');
    const petCard = document.getElementById('petCard');
    petCard.classList.remove('jump');
    void petCard.offsetWidth;
    petCard.classList.add('jump');
    renderStickers(gameId);
    renderPet();
    renderGames();
    speak(st.label + '好開心');
    try { history.replaceState({}, '', './index.html'); } catch (_) {}
  }

  document.getElementById('wonOk').onclick = () => document.getElementById('wonOv').classList.remove('on');
  document.getElementById('wonCert').onclick = () => {
    if (lastWon) MouseHubCert.showCert(lastWon);
  };

  const chk = document.getElementById('chkAutoSpeak');
  chk.checked = R.autoSpeak();
  chk.onchange = () => R.setAutoSpeak(chk.checked);

  nameInput.addEventListener('input', saveProfile);
  nameInput.addEventListener('keydown', e => e.stopPropagation());
  if (!who) who = IDS[0];
  saveProfile();
  renderIds();
  renderPet();
  renderStickers();
  renderGames();

  const won = new URLSearchParams(location.search).get('won');
  if (won && R.STICKER_META[won]) setTimeout(() => showWon(won), 120);
})();
</script>
</body>
</html>
