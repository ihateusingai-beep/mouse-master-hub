<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>滑鼠走走</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:"PingFang HK","Noto Sans TC",system-ui,sans-serif;color:#3D2B5A;
background:linear-gradient(180deg,#E3F2FD,#E8F5E9 50%,#FFF8E1);
-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overflow:hidden;cursor:none}
button{font:inherit;border:none;cursor:pointer}
.top{height:64px;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 12px;background:rgba(255,255,255,.92);border-bottom:3px solid rgba(33,150,243,.25);cursor:default}
.who{display:flex;align-items:center;gap:8px;font-weight:900}
.av{width:42px;height:42px;border-radius:50%;border:3px solid #42A5F5;display:grid;place-items:center;font-size:1.4rem;background:#fff}
.hint{flex:1;text-align:center;font-size:clamp(1.1rem,2.4vw,1.5rem);font-weight:900}
.hint b{background:#FFD54F;padding:2px 8px;border-radius:8px}
.icon{width:48px;height:48px;border-radius:14px;background:#fff;border:3px solid rgba(61,43,90,.12);font-size:1.2rem;font-weight:900;cursor:pointer}
.stage{height:calc(100% - 64px);position:relative;overflow:hidden}
.meter-wrap{position:absolute;left:12px;right:12px;top:10px;z-index:5;display:flex;align-items:center;gap:10px;cursor:default;pointer-events:none}
.meter{flex:1;height:16px;border-radius:999px;background:rgba(61,43,90,.12);overflow:hidden}
.meter>i{display:block;height:100%;width:0;background:linear-gradient(90deg,#69F0AE,#42A5F5);transition:width .2s}
.m-lab{font-weight:900;letter-spacing:2px;font-size:1.15rem}
.guide{position:absolute;left:12px;bottom:12px;z-index:5;background:rgba(255,255,255,.95);border:3px solid #42A5F5;border-radius:16px;padding:8px 12px;font-weight:900;cursor:default;pointer-events:none}
.zone{position:absolute;width:140px;height:140px;border-radius:50%;border:6px dashed #42A5F5;background:rgba(66,165,245,.18);
display:grid;place-items:center;font-size:2.8rem;z-index:3;transition:.15s;pointer-events:auto}
.zone.hot{background:rgba(105,240,174,.35);border-color:#22c55e;border-style:solid;transform:scale(1.08);box-shadow:0 0 0 10px rgba(34,197,94,.2)}
.cursor-dot{position:fixed;width:28px;height:28px;margin:-14px 0 0 -14px;border-radius:50%;background:#FF6B9D;border:4px solid #fff;
box-shadow:0 4px 12px rgba(0,0,0,.25);pointer-events:none;z-index:20;left:0;top:0}
.score-pop{position:absolute;font-size:2rem;font-weight:900;color:#22c55e;pointer-events:none;z-index:10;animation:up .7s ease forwards}
@keyframes up{to{transform:translateY(-40px);opacity:0}}
.overlay{position:fixed;inset:0;background:rgba(61,43,90,.45);display:none;align-items:center;justify-content:center;z-index:50;padding:16px;cursor:default}
.overlay.on{display:flex}
.modal{width:min(440px,94vw);background:#fff;border:5px solid #FFD54F;border-radius:28px;padding:24px 18px;text-align:center}
.modal h2{font-size:2rem;margin-bottom:6px}
.modal p{font-weight:800;opacity:.8;margin-bottom:14px}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.btn{min-height:56px;min-width:120px;padding:12px 18px;border-radius:999px;background:linear-gradient(135deg,#42A5F5,#66BB6A);color:#fff;font-size:1.15rem;font-weight:900}
.btn.ghost{background:#fff;color:#3D2B5A;border:3px solid rgba(61,43,90,.12)}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:45;overflow:hidden}
.confetti i{position:absolute;top:-16px;width:10px;height:16px;border-radius:3px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
</style>
</head>
<body>
<div class="confetti" id="confetti"></div>
<div class="cursor-dot" id="dot"></div>
<div class="top">
  <div class="who"><div class="av" id="av">🐱</div><span id="whoName">同學</span></div>
  <div class="hint">移去 <b>圈圈</b>（唔使撳）</div>
  <div class="row">
    <button class="icon" id="btnSpeak" type="button">🔊</button>
    <button class="icon" id="btnHub" type="button">🏠</button>
  </div>
</div>
<div class="stage" id="stage">
  <div class="meter-wrap"><div class="meter"><i id="fill"></i></div><div class="m-lab" id="mlab">🦴🦴🦴🦴🦴</div></div>
  <div class="guide">郁滑鼠入藍色圈 = 加分</div>
</div>
<div class="overlay" id="win">
  <div class="modal">
    <div style="font-size:2.4rem" id="winMedal">🥇</div>
    <h2>完成！</h2>
    <p id="winMsg">分數</p>
    <div class="row">
      <button class="btn ghost" id="btnRetry" type="button">再玩</button>
      <button class="btn" id="btnCert" type="button">證書</button>
      <button class="btn ghost" id="btnHub2" type="button">主頁</button>
    </div>
  </div>
</div>
<script src="./reward.js"></script>
<script src="./cert.js"></script>
<script>
document.addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('selectstart',e=>e.preventDefault());
const NEED=5, GID='move';
const $=id=>document.getElementById(id);
const stage=$('stage'), dot=$('dot');
let progress=0, didWin=false, audioCtx=null, zone=null, inside=false;
function loadProfile(){
  let who=null,name='';
  try{
    const p=new URLSearchParams(location.search);
    name=(p.get('name')||localStorage.getItem('mouse_hub_name')||'').trim();
    who=JSON.parse(localStorage.getItem('mouse_hub_who')||'null');
  }catch(_){}
  if(!who) who={emoji:'🐱',name:'同學'};
  $('av').textContent=who.emoji||'🐱';
  $('whoName').textContent=name||who.name||'同學';
  return name||who.name||'同學';
}
const displayName=loadProfile();
function ctx(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();return audioCtx}
function tone(f,d=.12,t='sine',v=.2){try{const c=ctx(),o=c.createOscillator(),g=c.createGain();o.type=t;o.frequency.value=f;g.gain.setValueAtTime(v,c.currentTime);g.gain.exponentialRampToValueAtTime(.01,c.currentTime+d);o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+d)}catch(_){}}
function sfxOk(){tone(660,.1);setTimeout(()=>tone(880,.12),70)}
function sfxWin(){[523,659,784,1046].forEach((f,i)=>setTimeout(()=>tone(f,.16,'triangle',.2),i*80))}
function speak(t){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='zh-HK';u.rate=.92;speechSynthesis.speak(u)}catch(_){}}
function confetti(){const box=$('confetti');box.innerHTML='';['#42A5F5','#69F0AE','#FFD54F','#FF6B9D'].forEach((c,i)=>{for(let j=0;j<7;j++){const el=document.createElement('i');el.style.left=Math.random()*100+'vw';el.style.background=c;el.style.animationDuration=(1+Math.random())+'s';box.appendChild(el)}});setTimeout(()=>box.innerHTML='',2500)}
function setProgress(n){progress=n;$('fill').style.width=(n/NEED*100)+'%';$('mlab').textContent=(MouseHubReward&&MouseHubReward.fishBones)?MouseHubReward.fishBones(n,NEED):n+'/'+NEED}
function rand(a,b){return a+Math.random()*(b-a)}
function popScore(x,y){const el=document.createElement('div');el.className='score-pop';el.textContent='+1';el.style.left=x+'px';el.style.top=y+'px';stage.appendChild(el);setTimeout(()=>el.remove(),700)}
window.addEventListener('pointermove',e=>{
  dot.style.left=e.clientX+'px';dot.style.top=e.clientY+'px';
  if(!zone||didWin) return;
  const r=zone.getBoundingClientRect();
  const cx=e.clientX, cy=e.clientY;
  const hit=cx>=r.left&&cx<=r.right&&cy>=r.top&&cy<=r.bottom;
  zone.classList.toggle('hot', hit);
  if(hit && !inside){
    inside=true;
    sfxOk();
    popScore(r.left+40, r.top);
    zone.remove(); zone=null;
    setProgress(progress+1);
    if(progress>=NEED) setTimeout(finish,350);
    else setTimeout(spawn,400);
  } else if(!hit) inside=false;
});
function spawn(){
  if(zone) zone.remove();
  inside=false;
  zone=document.createElement('div');
  zone.className='zone';
  zone.textContent=['⭐','🔵','🟢','🟡','🟣'][progress%5];
  zone.style.left=rand(8,70)+'%';
  zone.style.top=rand(18,62)+'%';
  stage.appendChild(zone);
}
function finish(){
  didWin=true;
  const a=MouseHubReward.award(GID, progress, 'move');
  confetti(); sfxWin();
  if(MouseHubReward.autoSpeak()) speak('做得好');
  $('winMedal').textContent=a.cert.meta.medal;
  $('winMsg').textContent=displayName+' · 分數 '+progress+' · '+a.cert.meta.label;
  $('win').classList.add('on');
}
function start(){didWin=false;setProgress(0);spawn();if(MouseHubReward.autoSpeak())speak('移去圈圈')}
$('btnHub').onclick=()=>location.href='./index.html';
$('btnHub2').onclick=()=>location.href=didWin?MouseHubReward.hubWonUrl(GID):'./index.html';
$('btnSpeak').onclick=()=>speak('移去圈圈，唔使撳');
$('btnRetry').onclick=()=>{$('win').classList.remove('on');start()};
$('btnCert').onclick=()=>MouseHubCert.showCert(GID);
window.addEventListener('pointerdown',()=>{try{ctx()}catch(_){}},{once:true});
start();
</script>
</body>
</html>
