<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>打氣筒救氣球</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:"PingFang HK","Noto Sans TC",system-ui,sans-serif;color:#3D2B5A;
background:linear-gradient(180deg,#D6F0FF 0%,#EAF7FF 40%,#FFE4F1 100%);
-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overflow:hidden}
button{font:inherit;border:none;cursor:pointer}
.top{height:60px;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 12px;background:rgba(255,255,255,.92);border-bottom:3px solid rgba(255,107,157,.25)}
.who{display:flex;align-items:center;gap:8px;font-weight:900}
.av{width:40px;height:40px;border-radius:50%;border:3px solid #FF6B9D;display:grid;place-items:center;font-size:1.3rem;background:#fff}
.hint{flex:1;text-align:center;font-size:clamp(1.05rem,2.3vw,1.4rem);font-weight:900}
.hint b{background:#FFD54F;padding:2px 8px;border-radius:8px}
.icon{width:46px;height:46px;border-radius:14px;background:#fff;border:3px solid rgba(61,43,90,.12);font-size:1.15rem;font-weight:900}
.stage{height:calc(100% - 60px);display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:10px 16px 18px;position:relative}
.hud{display:flex;gap:16px;align-items:center;font-weight:900;width:100%;max-width:520px;justify-content:space-between}
.timer{font-size:clamp(1.6rem,5vw,2.4rem)}
.timer.go{color:#C2185B}
.score{font-size:clamp(1.3rem,4vw,1.8rem)}
.score span{color:#FF6B9D;font-size:1.2em}
.scene{flex:1;width:100%;max-width:520px;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;min-height:0}
.sky{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.cloud{position:absolute;font-size:2rem;opacity:.5;animation:drift 12s linear infinite}
@keyframes drift{from{transform:translateX(-20px)}to{transform:translateX(20px)}}
.balloon-wrap{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;transition:transform .12s}
.balloon{
  width:100px;height:120px;border-radius:50% 50% 50% 50% / 45% 45% 55% 55%;
  background:radial-gradient(circle at 30% 28%,#fff 0%,#FF8A80 35%,#E53935 100%);
  border:4px solid rgba(0,0,0,.08);box-shadow:inset -12px -16px 0 rgba(0,0,0,.06),0 10px 24px rgba(229,57,53,.25);
  position:relative;transition:width .12s,height .12s,background .15s,filter .15s;
}
.balloon::after{content:'';position:absolute;left:50%;bottom:-14px;width:0;height:0;border-left:8px solid transparent;border-right:8px solid transparent;border-top:16px solid #E53935;transform:translateX(-50%);transition:border-top-color .15s}
.balloon.s0{width:70px;height:78px;filter:grayscale(.35) brightness(.9)}
.balloon.s1{width:90px;height:100px;background:radial-gradient(circle at 30% 28%,#fff 0%,#FFAB91 35%,#FF7043 100%)}
.balloon.s1::after{border-top-color:#FF7043}
.balloon.s2{width:110px;height:124px;background:radial-gradient(circle at 30% 28%,#fff 0%,#FF8A80 35%,#E53935 100%)}
.balloon.s3{width:130px;height:148px;background:radial-gradient(circle at 30% 28%,#fff 0%,#F48FB1 30%,#EC407A 100%);filter:drop-shadow(0 0 12px rgba(236,64,122,.45))}
.balloon.s3::after{border-top-color:#EC407A}
.balloon.s4{width:150px;height:170px;background:radial-gradient(circle at 30% 28%,#fff 0%,#CE93D8 30%,#AB47BC 100%);filter:drop-shadow(0 0 18px rgba(171,71,188,.5))}
.balloon.s4::after{border-top-color:#AB47BC}
.string{width:2px;height:36px;background:rgba(61,43,90,.35);margin-top:-2px}
.face{position:absolute;inset:0;display:grid;place-items:center;font-size:1.8rem;pointer-events:none;transition:.15s}
.pump-line{width:4px;height:28px;background:#90A4AE;border-radius:2px;margin:4px 0}
.pad{
  width:min(220px,56vw);height:min(120px,22vh);border-radius:28px;
  border:6px solid #FF6B9D;background:linear-gradient(180deg,#FFE4F1,#fff);
  box-shadow:0 10px 28px rgba(255,107,157,.35);
  font-size:clamp(1.4rem,4vw,1.8rem);font-weight:900;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  user-select:none;touch-action:manipulation;z-index:3;transition:transform .05s;
}
.pad .em{font-size:2.2rem;line-height:1}
.pad:active,.pad.hit{transform:scale(.94);background:#FFCDD2}
.pad.disabled{opacity:.5;pointer-events:none}
.cheer{position:absolute;top:12%;left:50%;transform:translateX(-50%) scale(.8);font-size:1.5rem;font-weight:900;color:#C2185B;
opacity:0;pointer-events:none;z-index:8;transition:.2s;text-shadow:0 2px 0 #fff;white-space:nowrap}
.cheer.on{opacity:1;transform:translateX(-50%) scale(1.1)}
.guide{font-weight:900;opacity:.7;text-align:center}
.overlay{position:fixed;inset:0;background:rgba(61,43,90,.45);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.overlay.on{display:flex}
.modal{width:min(440px,94vw);background:#fff;border:5px solid #FFD54F;border-radius:28px;padding:24px 18px;text-align:center}
.modal h2{font-size:2rem;margin-bottom:6px}
.modal p{font-weight:800;opacity:.8;margin-bottom:14px}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.btn{min-height:56px;min-width:120px;padding:12px 18px;border-radius:999px;background:linear-gradient(135deg,#FF6B9D,#FF9D7A);color:#fff;font-size:1.15rem;font-weight:900}
.btn.ghost{background:#fff;color:#3D2B5A;border:3px solid rgba(61,43,90,.12)}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:45;overflow:hidden}
.confetti i{position:absolute;top:-16px;width:10px;height:16px;border-radius:3px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.start-ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:rgba(255,255,255,.78);z-index:6;text-align:center;padding:16px}
.start-ov .story{font-size:1.35rem;font-weight:900;line-height:1.4}
.start-ov .btn{min-width:200px;font-size:1.4rem}
.fly-away{animation:fly 1.2s ease forwards}
@keyframes fly{to{transform:translateY(-120%) scale(1.2);opacity:.3}}
.count3{font-size:4rem;font-weight:900;color:#FF6B9D}
</style>
</head>
<body>
<div class="confetti" id="confetti"></div>
<div class="top">
  <div class="who"><div class="av" id="av">🐱</div><span id="whoName">同學</span></div>
  <div class="hint">泵 <b>氣筒</b> 救氣球</div>
  <div class="row">
    <button class="icon" id="btnSpeak" type="button">🔊</button>
    <button class="icon" id="btnHub" type="button">🏠</button>
  </div>
</div>
<div class="stage" id="stage">
  <div class="hud">
    <div class="timer" id="timer">10</div>
    <div class="score">泵咗 <span id="score">0</span> 下</div>
  </div>
  <div class="scene">
    <div class="sky"><span class="cloud" style="left:10%;top:8%">☁️</span><span class="cloud" style="left:70%;top:18%;animation-delay:-4s">☁️</span></div>
    <div class="cheer" id="cheer">再泵！</div>
    <div class="balloon-wrap" id="bwrap">
      <div class="balloon s0" id="balloon"><div class="face" id="face">😴</div></div>
      <div class="string"></div>
    </div>
    <div class="pump-line"></div>
  </div>
  <button class="pad disabled" id="pad" type="button"><span class="em">🫁</span>氣筒 · 左掣</button>
  <div class="guide">快快撳氣筒 · 救氣球升空</div>
  <div class="start-ov" id="startOv">
    <div class="story">🎈 氣球癟咗…<br>用左掣泵氣筒救佢！</div>
    <div class="count3" id="count3" hidden></div>
    <button class="btn" id="btnGo" type="button">開始泵！</button>
  </div>
</div>
<div class="overlay" id="win">
  <div class="modal">
    <div style="font-size:2.6rem" id="winMedal">🥇</div>
    <h2 id="winTitle">升空喇！</h2>
    <p id="winMsg">分數</p>
    <div class="row">
      <button class="btn ghost" id="btnRetry" type="button">再玩</button>
      <button class="btn" id="btnCert" type="button">證書</button>
      <button class="btn ghost" id="btnHub2" type="button">主頁</button>
    </div>
  </div>
</div>
<script src="./reward.js"></script>
<script src="./cert.js"></script>
<script>
document.addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('selectstart',e=>e.preventDefault());
const GID='clickL', SECS=10;
const $=id=>document.getElementById(id);
const pad=$('pad'), balloon=$('balloon'), face=$('face'), bwrap=$('bwrap'), cheer=$('cheer');
let score=0, left=SECS, timer=null, running=false, didWin=false, audioCtx=null, lastMile=0;
function loadProfile(){
  let who=null,name='';
  try{
    const p=new URLSearchParams(location.search);
    name=(p.get('name')||localStorage.getItem('mouse_hub_name')||'').trim();
    who=JSON.parse(localStorage.getItem('mouse_hub_who')||'null');
  }catch(_){}
  if(!who) who={emoji:'🐱',name:'同學'};
  $('av').textContent=who.emoji||'🐱';
  $('whoName').textContent=name||who.name||'同學';
  return name||who.name||'同學';
}
const displayName=loadProfile();
function ctx(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();return audioCtx}
function tone(f,d=.08,t='sine',v=.16){try{const c=ctx(),o=c.createOscillator(),g=c.createGain();o.type=t;o.frequency.value=f;g.gain.setValueAtTime(v,c.currentTime);g.gain.exponentialRampToValueAtTime(.01,c.currentTime+d);o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+d)}catch(_){}}
function sfxPump(){tone(180+Math.min(score*12,280),.06,'triangle',.12);setTimeout(()=>tone(420+Math.min(score*10,300),.07),40)}
function sfxMile(){[523,659,784].forEach((f,i)=>setTimeout(()=>tone(f,.1,'sine',.15),i*60))}
function sfxWin(){[523,659,784,1046].forEach((f,i)=>setTimeout(()=>tone(f,.16,'triangle',.2),i*80))}
function speak(t){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='zh-HK';u.rate=.92;speechSynthesis.speak(u)}catch(_){}}
function confetti(){const box=$('confetti');box.innerHTML='';for(let i=0;i<36;i++){const el=document.createElement('i');el.style.left=Math.random()*100+'vw';el.style.background=['#FF6B9D','#FFD54F','#69F0AE','#4FC3F7'][i%4];el.style.animationDuration=(1+Math.random()*1.2)+'s';box.appendChild(el)}setTimeout(()=>box.innerHTML='',2600)}
function showCheer(t){cheer.textContent=t;cheer.classList.add('on');clearTimeout(cheer._t);cheer._t=setTimeout(()=>cheer.classList.remove('on'),700)}
function stageOf(n){
  if(n>=20) return 4;
  if(n>=12) return 3;
  if(n>=7) return 2;
  if(n>=3) return 1;
  return 0;
}
function faces(s){return ['😴','😐','🙂','😄','🤩'][s]}
function paintBalloon(){
  const s=stageOf(score);
  balloon.className='balloon s'+s;
  face.textContent=faces(s);
  face.style.fontSize=(1.4+s*0.25)+'rem';
  bwrap.style.transform='translateY('+(-s*6)+'px)';
}
function tick(){
  left--;
  $('timer').textContent=left;
  if(left<=0) finish();
}
function finish(){
  if(didWin) return;
  didWin=true; running=false;
  clearInterval(timer);
  pad.classList.add('disabled');
  const a=MouseHubReward.award(GID, score, 'race');
  const s=stageOf(score);
  if(s>=4){ bwrap.classList.add('fly-away'); confetti(); }
  else confetti();
  sfxWin();
  if(MouseHubReward.autoSpeak()) speak('做得好');
  $('winMedal').textContent=a.cert.meta.medal;
  const lines=['有少少氣','圓咗啲','好圓！','好大個！','飛上天喇！'];
  $('winTitle').textContent=lines[s];
  $('winMsg').textContent=displayName+' · 泵咗 '+score+' 下 · '+a.cert.meta.label;
  $('win').classList.add('on');
}
function onHit(e){
  if(!running) return;
  if(e && e.button!=null && e.button!==0) return;
  if(e) e.preventDefault();
  score++;
  $('score').textContent=score;
  pad.classList.add('hit');
  setTimeout(()=>pad.classList.remove('hit'),70);
  sfxPump();
  paintBalloon();
  // milestones
  if(score===5){ showCheer('再泵！'); sfxMile(); }
  else if(score===10){ showCheer('好大！'); sfxMile(); }
  else if(score===15){ showCheer('差啲飛！'); sfxMile(); }
  else if(score===20){ showCheer('升空！🌈'); sfxMile(); confetti(); }
  else if(score%4===0) showCheer('泵！');
}
pad.addEventListener('pointerdown', onHit);
function countdownThenStart(){
  const c=$('count3'); const go=$('btnGo'); const story=$('startOv').querySelector('.story');
  go.hidden=true; story.hidden=true; c.hidden=false;
  let n=3;
  c.textContent=n;
  const iv=setInterval(()=>{
    n--;
    if(n>0){ c.textContent=n; tone(400+n*80,.1); }
    else {
      clearInterval(iv);
      c.textContent='GO!';
      tone(880,.15);
      setTimeout(()=>{ $('startOv').style.display='none'; begin(); },350);
    }
  },500);
}
function begin(){
  didWin=false; score=0; left=SECS; running=true; lastMile=0;
  bwrap.classList.remove('fly-away');
  $('score').textContent='0';
  $('timer').textContent=SECS;
  $('timer').classList.add('go');
  pad.classList.remove('disabled');
  paintBalloon();
  clearInterval(timer);
  timer=setInterval(tick,1000);
}
function reset(){
  clearInterval(timer); running=false; didWin=false; score=0; left=SECS;
  $('score').textContent='0'; $('timer').textContent=SECS; $('timer').classList.remove('go');
  pad.classList.add('disabled');
  bwrap.classList.remove('fly-away');
  paintBalloon();
  $('win').classList.remove('on');
  const ov=$('startOv');
  ov.style.display='flex';
  ov.querySelector('.story').hidden=false;
  $('btnGo').hidden=false;
  $('count3').hidden=true;
}
$('btnGo').onclick=()=>{ try{ctx()}catch(_){} countdownThenStart(); };
$('btnHub').onclick=()=>location.href='./index.html';
$('btnHub2').onclick=()=>location.href=didWin?MouseHubReward.hubWonUrl(GID):'./index.html';
$('btnSpeak').onclick=()=>speak('撳氣筒救氣球');
$('btnRetry').onclick=reset;
$('btnCert').onclick=()=>MouseHubCert.showCert(GID);
paintBalloon();
</script>
</body>
</html>
